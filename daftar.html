<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulir Pendaftaran — SPMB Mudacil</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="bungkus">
    <div class="kop">
        <div class="lambang">S</div>
        <div>
            <div class="nama-sistem" id="txtNamaAplikasi">SPMB<span>Mudacil</span></div>
            <div class="nama-sekolah" id="txtNamaSekolah">SMP Muhammadiyah 2 Cilacap</div>
        </div>
    </div>

    <div id="areaMuat" class="pemuat"><div class="spinner"></div>Memeriksa status pendaftaran…</div>
    <div id="areaKonten" class="isi" style="display:none;"></div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
    const KUNCI_DRAFT = "SPMB_DRAFT_2627_V1";
    let draft = {};
    let langkahSaatIni = 0; // 0 = landing, 1..4 = step wizard
    let cfgPublik = {};
    let sedangKirim = false;

    // -----------------------------------------------------------------
    // BOOTSTRAP
    // -----------------------------------------------------------------
    async function mulai() {
        try {
            const [resStatus, resConfig] = await Promise.all([API.cekStatus(), API.getConfig()]);

            if (!resStatus.ok) {
                tampilkanErrorFatal("Tidak bisa memeriksa status pendaftaran: " + resStatus.pesan);
                return;
            }
            cfgPublik = (resConfig.ok && resConfig.data) ? resConfig.data : {};
            if (cfgPublik.NAMA_APLIKASI) document.getElementById("txtNamaAplikasi").innerHTML = cfgPublik.NAMA_APLIKASI;
            if (cfgPublik.NAMA_SEKOLAH) document.getElementById("txtNamaSekolah").textContent = cfgPublik.NAMA_SEKOLAH;

            // Gerbang (Bagian 5): halaman ini SELALU alur pendaftar BARU,
            // jadi status "Tidak" ATAU "Offline" dua-duanya mengalihkan ke form_tutup.html.
            // (Server tetap mengulang cek ini saat submitPendaftaran — ini cuma UX.)
            if (resStatus.data.status === "Tidak" || resStatus.data.status === "Offline") {
                window.location.href = "form_tutup.html";
                return;
            }

            muatDraftDariLocalStorage();
            document.getElementById("areaMuat").style.display = "none";
            document.getElementById("areaKonten").style.display = "block";
            render();
        } catch (err) {
            tampilkanErrorFatal("Error jaringan: " + err.message);
        }
    }

    function tampilkanErrorFatal(pesan) {
        document.getElementById("areaMuat").innerHTML =
            "<div class=\"pesan-error-umum tampil\">" + UI.escapeHtml(pesan) + "<br><br>Coba muat ulang halaman.</div>";
    }

    // -----------------------------------------------------------------
    // DRAFT (Bagian 9: autosave localStorage, dihapus HANYA kalau submit sukses)
    // -----------------------------------------------------------------
    function muatDraftDariLocalStorage() {
        try {
            const raw = localStorage.getItem(KUNCI_DRAFT);
            if (raw) {
                const parsed = JSON.parse(raw);
                draft = parsed.draft || {};
                langkahSaatIni = parsed.langkah || 1;
            } else {
                langkahSaatIni = 1;
            }
        } catch (err) {
            langkahSaatIni = 1;
        }
    }

    function simpanDraft() {
        localStorage.setItem(KUNCI_DRAFT, JSON.stringify({ draft: draft, langkah: langkahSaatIni }));
    }

    function hapusDraft() {
        localStorage.removeItem(KUNCI_DRAFT);
        draft = {};
        langkahSaatIni = 1;
    }

    // -----------------------------------------------------------------
    // RENDER ROUTER
    // -----------------------------------------------------------------
    function render() {
        const area = document.getElementById("areaKonten");
        if (langkahSaatIni === 0) { area.innerHTML = htmlLanding(); return; }

        const isiStep = { 1: htmlStep1, 2: htmlStep2, 3: htmlStep3, 4: htmlStep4 }[langkahSaatIni]();
        area.innerHTML = htmlIndikatorLangkah() + isiStep;

        const setup = { 1: setupStep1, 2: setupStep2, 3: setupStep3, 4: setupStep4 }[langkahSaatIni];
        if (setup) setup();
    }

    // -----------------------------------------------------------------
    // STEP 0 — LANDING (info gelombang/biaya/jadwal + 2 tombol, Bagian 9)
    // -----------------------------------------------------------------
    function htmlLanding() {
        const biayaDaftar = cfgPublik.BIAYA_PENDAFTARAN || "0";
        const biayaDpMin = cfgPublik.BIAYA_DP_MIN || "0";
        const tahunAjaran = cfgPublik.TAHUN_AJARAN || "";
        const gelombangNama = cfgPublik.GELOMBANG_1_NAMA || "Gelombang Aktif";

        return `
            <div class="hero-gelap">
                <span class="lencana">${UI.ikon("petir")} Pendaftaran Buka</span>
                <h1>Penerimaan Murid Baru</h1>
                <p>Proses 100% online. Isi data diri &amp; akademik, lalu upload berkas kapan saja dari Dashboard Pendaftar.</p>
                <button class="utama blok" id="btnDaftarBaru">Daftar Baru Sekarang ${UI.ikon("panah")}</button>
                <div style="height:8px;"></div>
                <a class="tombol gelap blok" href="login.html">${UI.ikon("kunci")} Sudah Pernah Daftar? Login</a>
            </div>

            <h2 style="margin-top:20px;">Info Gelombang &amp; Biaya</h2>
            <div class="kartu-info">
                <div class="baris-info"><span class="label">Tahun Ajaran</span><span class="nilai">${UI.escapeHtml(tahunAjaran)}</span></div>
                <div class="baris-info"><span class="label">Gelombang aktif</span><span class="nilai">${UI.escapeHtml(gelombangNama)}</span></div>
            </div>
            <div class="grid-2">
                <div class="kartu">
                    <div class="teks-kecil">BIAYA PENDAFTARAN</div>
                    <div style="font-weight:800; color:var(--hijau-700); margin-top:2px;">${UI.formatRupiah(biayaDaftar)}</div>
                </div>
                <div class="kartu">
                    <div class="teks-kecil">DP MINIMAL</div>
                    <div style="font-weight:800; margin-top:2px;">${UI.formatRupiah(biayaDpMin)}</div>
                    <div class="teks-kecil">Opsional saat submit</div>
                </div>
            </div>

            ${htmlTombolWA()}
        `;
    }

    function htmlTombolWA() {
        const admin1Nama = cfgPublik.ADMIN_WA_1_NAMA, admin1No = cfgPublik.ADMIN_WA_1_NOMOR;
        const admin2Nama = cfgPublik.ADMIN_WA_2_NAMA, admin2No = cfgPublik.ADMIN_WA_2_NOMOR;
        if (!admin1No && !admin2No) return "";
        let tombol = "";
        if (admin1No) tombol += `<a class="tombol tombol-wa" target="_blank" rel="noreferrer" href="${UI.linkWA(admin1No, admin1Nama)}">${UI.ikon("wa")} ${UI.escapeHtml(admin1Nama || "WA Admin 1")}</a>`;
        if (admin2No) tombol += `<a class="tombol tombol-wa" target="_blank" rel="noreferrer" href="${UI.linkWA(admin2No, admin2Nama)}">${UI.ikon("wa")} ${UI.escapeHtml(admin2Nama || "WA Admin 2")}</a>`;
        return `<h3 style="margin-top:18px;">Butuh Bantuan?</h3><div class="tombol-wa-grid">${tombol}</div>`;
    }

    document.addEventListener("click", function (e) {
        if (e.target && e.target.id === "btnDaftarBaru") {
            langkahSaatIni = 1;
            simpanDraft();
            render();
        }
    });

    // -----------------------------------------------------------------
    // INDIKATOR LANGKAH (step 1-4)
    // -----------------------------------------------------------------
    function htmlIndikatorLangkah() {
        let titik = "";
        for (let i = 1; i <= 4; i++) {
            titik += `<div class="titik ${i < langkahSaatIni ? "selesai" : (i === langkahSaatIni ? "aktif" : "")}"></div>`;
        }
        const namaLangkah = ["", "Data Diri Calon Siswa", "Data Orang Tua/Wali", "Pilihan Sekolah &amp; Akademik", "Ringkasan &amp; Kirim"];
        return `<div class="label-langkah">Langkah ${langkahSaatIni} dari 4</div>
                <div class="indikator-langkah">${titik}</div>
                <h2 class="judul-langkah">${namaLangkah[langkahSaatIni]}</h2>`;
    }

    // -----------------------------------------------------------------
    // STEP 1 — DATA DIRI CALON SISWA (Bagian 6.3 & 9)
    // -----------------------------------------------------------------
    function htmlStep1() {
        return `
            <div class="field">
                <label>Nama Lengkap <span class="opsional">(sesuai Akte/Ijazah)</span></label>
                <input type="text" id="f_namaLengkap" required>
            </div>

            <div class="grup-2kolom">
                <div class="field">
                    <label>NISN <span class="opsional">(10 digit)</span></label>
                    <input type="text" id="f_nisn" inputmode="numeric" maxlength="10" pattern="\\d{10}" required>
                    <div class="error-field">NISN harus 10 digit angka.</div>
                </div>
                <div class="field">
                    <label>No. HP <span class="opsional">(login &amp; notifikasi)</span></label>
                    <input type="text" id="f_noHp" inputmode="numeric" maxlength="14" placeholder="08xxxxxxxxxx" required>
                    <div class="error-field">Format No HP harus 08xxxxxxxxxx.</div>
                </div>
            </div>

            <label>Email <span class="opsional">(opsional, bisa dipakai login Google)</span></label>
            <input type="text" id="f_email">

            <label>Jenis Kelamin</label>
            <div class="pilihan-radio">
                <label><input type="radio" name="jk" value="Laki-laki"><span>Laki-laki</span></label>
                <label><input type="radio" name="jk" value="Perempuan"><span>Perempuan</span></label>
            </div>

            <div class="grup-2kolom">
                <div class="field">
                    <label>Tempat Lahir</label>
                    <input type="text" id="f_tempatLahir" required>
                </div>
                <div class="field">
                    <label>Tanggal Lahir</label>
                    <input type="date" id="f_tanggalLahir" required>
                </div>
            </div>

            <label>Asal Sekolah</label>
            <select id="f_asalSekolah"><option value="">Memuat daftar sekolah…</option></select>
            <div class="kotak-manual" id="kotakManualSekolah">
                <input type="text" id="f_asalSekolahManual" placeholder="Tulis nama sekolah asal">
            </div>

            <h3 style="margin-top:22px;">Alamat</h3>
            <label>Jalan / RT / RW</label>
            <input type="text" id="f_jalan" placeholder="Jl. Mawar No.5 RT 02 RW 03" required>

            <div class="grup-2kolom">
                <div class="field">
                    <label>Kecamatan</label>
                    <select id="f_kecamatan"><option value="">Memuat…</option></select>
                    <div class="kotak-manual" id="kotakManualKecamatan">
                        <input type="text" id="f_kecamatanManual" placeholder="Tulis nama kecamatan">
                    </div>
                </div>
                <div class="field">
                    <label>Desa/Kelurahan</label>
                    <select id="f_desa"><option value="">Pilih kecamatan dulu</option></select>
                    <div class="kotak-manual" id="kotakManualDesa">
                        <input type="text" id="f_desaManual" placeholder="Tulis nama desa/kelurahan">
                    </div>
                </div>
            </div>

            <div class="grup-2kolom">
                <div class="field">
                    <label>Kabupaten/Kota</label>
                    <input type="text" id="f_kabupaten" value="Kabupaten Cilacap" required>
                </div>
                <div class="field">
                    <label>Kode Pos</label>
                    <input type="text" id="f_kodePos" inputmode="numeric" maxlength="5" pattern="\\d{5}">
                </div>
            </div>

            <div class="grup-2kolom">
                <div class="field">
                    <label>Anak ke-</label>
                    <input type="text" id="f_anakKe" inputmode="numeric" maxlength="2">
                </div>
                <div class="field">
                    <label>Jumlah Saudara</label>
                    <input type="text" id="f_jumlahSaudara" inputmode="numeric" maxlength="2">
                </div>
            </div>

            <div class="pesan-error-umum" id="errorStep1"></div>

            <div class="tombol-baris">
                <button id="btnKembaliStep1">${UI.ikon("panahKiri")} Kembali</button>
                <button class="utama" id="btnLanjutStep1">Lanjut ${UI.ikon("panah")}</button>
            </div>
        `;
    }

    async function setupStep1() {
        const d = draft;
        if (d.namaLengkap) document.getElementById("f_namaLengkap").value = d.namaLengkap;
        if (d.nisn) document.getElementById("f_nisn").value = d.nisn;
        if (d.noHp) document.getElementById("f_noHp").value = d.noHp;
        if (d.email) document.getElementById("f_email").value = d.email;
        if (d.jenisKelamin) {
            const r = document.querySelector('input[name="jk"][value="' + d.jenisKelamin + '"]');
            if (r) r.checked = true;
        }
        if (d._tempatLahirMentah) document.getElementById("f_tempatLahir").value = d._tempatLahirMentah;
        if (d._tanggalLahirMentah) document.getElementById("f_tanggalLahir").value = d._tanggalLahirMentah;
        if (d.jalan) document.getElementById("f_jalan").value = d.jalan;
        if (d.kabupaten) document.getElementById("f_kabupaten").value = d.kabupaten;
        if (d.kodePos) document.getElementById("f_kodePos").value = d.kodePos;
        if (d.anakKe) document.getElementById("f_anakKe").value = d.anakKe;
        if (d.jumlahSaudara) document.getElementById("f_jumlahSaudara").value = d.jumlahSaudara;

        // --- Asal sekolah ---
        const selSekolah = document.getElementById("f_asalSekolah");
        const kotakManualSekolah = document.getElementById("kotakManualSekolah");
        try {
            const res = await API.getReferensiSekolah();
            const daftarSekolah = (res.ok && res.data) ? res.data : [];
            selSekolah.innerHTML = '<option value="">— Pilih sekolah —</option>' +
                daftarSekolah.map(function (s) { return `<option value="${UI.escapeHtml(s.NAMA_SEKOLAH)}">${UI.escapeHtml(s.NAMA_SEKOLAH)}</option>`; }).join("") +
                '<option value="__LAINNYA__">Sekolah tidak ada di daftar / luar Cilacap (isi manual)</option>';
            if (d._asalSekolahManual) {
                selSekolah.value = "__LAINNYA__";
                kotakManualSekolah.classList.add("tampil");
                document.getElementById("f_asalSekolahManual").value = d._asalSekolahManual;
            } else if (d.asalSekolah) {
                selSekolah.value = d.asalSekolah;
            }
        } catch (err) {
            selSekolah.innerHTML = '<option value="__LAINNYA__">Gagal memuat — isi manual</option>';
            selSekolah.value = "__LAINNYA__";
            kotakManualSekolah.classList.add("tampil");
        }
        selSekolah.addEventListener("change", function () {
            kotakManualSekolah.classList.toggle("tampil", selSekolah.value === "__LAINNYA__");
        });

        // --- Kecamatan -> Desa (cascading, Bagian 15) ---
        const selKecamatan = document.getElementById("f_kecamatan");
        const kotakManualKecamatan = document.getElementById("kotakManualKecamatan");
        const selDesa = document.getElementById("f_desa");
        const kotakManualDesa = document.getElementById("kotakManualDesa");

        async function muatKecamatan() {
            try {
                const res = await API.getWilayahLokal("kecamatan", "");
                const daftarWilayah = (res.ok && res.data) ? res.data : [];
                selKecamatan.innerHTML = '<option value="">— Pilih kecamatan —</option>' +
                    daftarWilayah.map(function (w) { return `<option value="${w.KODE}" data-nama="${UI.escapeHtml(w.NAMA)}">${UI.escapeHtml(w.NAMA)}</option>`; }).join("") +
                    '<option value="__LAINNYA__">Kecamatan tidak ada di daftar (isi manual)</option>';
                if (d._kecamatanManual) {
                    selKecamatan.value = "__LAINNYA__";
                    kotakManualKecamatan.classList.add("tampil");
                    document.getElementById("f_kecamatanManual").value = d._kecamatanManual;
                } else if (d._kecamatanKode) {
                    selKecamatan.value = d._kecamatanKode;
                    muatDesa(d._kecamatanKode);
                }
            } catch (err) {
                selKecamatan.innerHTML = '<option value="__LAINNYA__">Gagal memuat — isi manual</option>';
                selKecamatan.value = "__LAINNYA__";
                kotakManualKecamatan.classList.add("tampil");
            }
        }

        async function muatDesa(kodeKecamatan) {
            selDesa.innerHTML = '<option value="">Memuat…</option>';
            try {
                const res = await API.getWilayahLokal("desa", kodeKecamatan);
                const daftarWilayah = (res.ok && res.data) ? res.data : [];
                selDesa.innerHTML = '<option value="">— Pilih desa/kelurahan —</option>' +
                    daftarWilayah.map(function (w) { return `<option value="${UI.escapeHtml(w.NAMA)}">${UI.escapeHtml(w.NAMA)}</option>`; }).join("") +
                    '<option value="__LAINNYA__">Tidak ada di daftar (isi manual)</option>';
                if (d._desaManual) {
                    selDesa.value = "__LAINNYA__";
                    kotakManualDesa.classList.add("tampil");
                    document.getElementById("f_desaManual").value = d._desaManual;
                } else if (d.desa) {
                    selDesa.value = d.desa;
                }
            } catch (err) {
                selDesa.innerHTML = '<option value="__LAINNYA__">Gagal memuat — isi manual</option>';
            }
        }

        selKecamatan.addEventListener("change", function () {
            const manual = selKecamatan.value === "__LAINNYA__";
            kotakManualKecamatan.classList.toggle("tampil", manual);
            if (!manual && selKecamatan.value) muatDesa(selKecamatan.value);
        });
        selDesa.addEventListener("change", function () {
            kotakManualDesa.classList.toggle("tampil", selDesa.value === "__LAINNYA__");
        });

        muatKecamatan();

        document.getElementById("btnKembaliStep1").addEventListener("click", function () {
            langkahSaatIni = 0;
            simpanDraft();
            render();
        });
        document.getElementById("btnLanjutStep1").addEventListener("click", prosesLanjutStep1);
    }

    function prosesLanjutStep1() {
        const ambil = function (id) { return document.getElementById(id).value.trim(); };
        const errorBox = document.getElementById("errorStep1");
        errorBox.classList.remove("tampil");
        errorBox.textContent = "";

        const namaLengkap = ambil("f_namaLengkap");
        const nisn = ambil("f_nisn");
        const noHp = ambil("f_noHp");
        const jkEl = document.querySelector('input[name="jk"]:checked');
        const tempatLahir = ambil("f_tempatLahir");
        const tanggalLahir = ambil("f_tanggalLahir");
        const jalan = ambil("f_jalan");
        const kabupaten = ambil("f_kabupaten");
        const kodePos = ambil("f_kodePos");

        const kesalahan = [];
        if (!namaLengkap) kesalahan.push("Nama lengkap wajib diisi.");
        if (!/^\d{10}$/.test(nisn)) kesalahan.push("NISN harus 10 digit angka.");
        if (!/^08\d{8,11}$/.test(noHp)) kesalahan.push("Format No HP tidak valid (08xxxxxxxxxx).");
        if (!jkEl) kesalahan.push("Jenis kelamin wajib dipilih.");
        if (!tempatLahir || !tanggalLahir) kesalahan.push("Tempat & tanggal lahir wajib diisi.");
        if (!jalan) kesalahan.push("Alamat (Jalan/RT/RW) wajib diisi.");
        if (!kabupaten) kesalahan.push("Kabupaten/Kota wajib diisi.");

        const selSekolah = document.getElementById("f_asalSekolah");
        const asalSekolahManual = ambil("f_asalSekolahManual");
        const asalSekolahFinal = selSekolah.value === "__LAINNYA__" ? asalSekolahManual : selSekolah.value;
        if (!asalSekolahFinal) kesalahan.push("Asal sekolah wajib diisi.");

        const selKecamatan = document.getElementById("f_kecamatan");
        const kecamatanManual = ambil("f_kecamatanManual");
        const kecamatanNamaFinal = selKecamatan.value === "__LAINNYA__"
            ? kecamatanManual
            : (selKecamatan.selectedOptions[0] ? selKecamatan.selectedOptions[0].getAttribute("data-nama") : "");

        const selDesa = document.getElementById("f_desa");
        const desaManual = ambil("f_desaManual");
        const desaFinal = selDesa.value === "__LAINNYA__" ? desaManual : selDesa.value;

        if (!kecamatanNamaFinal) kesalahan.push("Kecamatan wajib diisi.");
        if (!desaFinal) kesalahan.push("Desa/Kelurahan wajib diisi.");

        if (kesalahan.length) {
            errorBox.innerHTML = kesalahan.join("<br>");
            errorBox.classList.add("tampil");
            return;
        }

        const alamatGabungan = [jalan, desaFinal, kecamatanNamaFinal, kabupaten, kodePos].join("; ");
        const tempatTglLahirGabungan = tempatLahir + ", " + tanggalLahir;

        draft = Object.assign(draft, {
            namaLengkap: namaLengkap,
            nisn: nisn,
            noHp: noHp,
            email: ambil("f_email"),
            jenisKelamin: jkEl.value,
            tempatTglLahir: tempatTglLahirGabungan,
            _tempatLahirMentah: tempatLahir,
            _tanggalLahirMentah: tanggalLahir,
            asalSekolah: asalSekolahFinal,
            _asalSekolahManual: selSekolah.value === "__LAINNYA__" ? asalSekolahManual : "",
            alamat: alamatGabungan,
            jalan: jalan,
            desa: desaFinal,
            _desaManual: selDesa.value === "__LAINNYA__" ? desaManual : "",
            _kecamatanKode: selKecamatan.value !== "__LAINNYA__" ? selKecamatan.value : "",
            _kecamatanManual: selKecamatan.value === "__LAINNYA__" ? kecamatanManual : "",
            kabupaten: kabupaten,
            kodePos: kodePos,
            anakKe: ambil("f_anakKe"),
            jumlahSaudara: ambil("f_jumlahSaudara"),
        });
        langkahSaatIni = 2;
        simpanDraft();
        render();
    }

    // -----------------------------------------------------------------
    // STEP 2 — DATA ORANG TUA/WALI (Bagian 6.3 & 9)
    // -----------------------------------------------------------------
    function htmlStep2() {
        return `
            <div class="catatan amber">${UI.ikon("info")}<span>Minimal 1 No. HP aktif dari Ayah/Ibu/Wali wajib diisi.</span></div>

            <div class="kartu">
                <div class="baris-toggle" style="margin-bottom:10px;">
                    <h3 style="margin:0;">Data Ayah Kandung</h3>
                    <label style="display:flex; align-items:center; gap:6px; margin:0; font-weight:500; font-size:0.78rem;">
                        <input type="checkbox" id="f_ayahAlmarhum" style="width:auto;"> Almarhum
                    </label>
                </div>
                <label style="margin-top:0;">Nama Ayah</label>
                <input type="text" id="f_namaAyah">
                <label>Pekerjaan Ayah</label>
                <input type="text" id="f_pekerjaanAyah">
                <div id="blokHpAyah">
                    <label>No. HP Ayah</label>

    function setupStep2() {
        const d = draft;
        const isi = function (id, val) { if (val) document.getElementById(id).value = val; };
        isi("f_namaAyah", d.namaAyah); isi("f_pekerjaanAyah", d.pekerjaanAyah); isi("f_noHpAyah", d.noHpAyah); isi("f_alamatAyah", d.alamatAyah);
        isi("f_namaIbu", d.namaIbu); isi("f_pekerjaanIbu", d.pekerjaanIbu); isi("f_noHpIbu", d.noHpIbu);
        isi("f_namaWali", d.namaWali); isi("f_hubunganWali", d.hubunganWali); isi("f_noHpWali", d.noHpWali);

        const ayahAlmarhum = document.getElementById("f_ayahAlmarhum");
        const blokHpAyah = document.getElementById("blokHpAyah");
        ayahAlmarhum.checked = d.sudahAlmarhumAyah === "Ya";
        blokHpAyah.style.display = ayahAlmarhum.checked ? "none" : "block";
        ayahAlmarhum.addEventListener("change", function () { blokHpAyah.style.display = ayahAlmarhum.checked ? "none" : "block"; });

        const ibuAlmarhum = document.getElementById("f_ibuAlmarhum");
        const blokHpIbu = document.getElementById("blokHpIbu");
        ibuAlmarhum.checked = d.sudahAlmarhumIbu === "Ya";
        blokHpIbu.style.display = ibuAlmarhum.checked ? "none" : "block";
        ibuAlmarhum.addEventListener("change", function () { blokHpIbu.style.display = ibuAlmarhum.checked ? "none" : "block"; });

        const ibuAlamatSama = document.getElementById("f_ibuAlamatSama");
        const blokAlamatIbu = document.getElementById("blokAlamatIbu");
        ibuAlamatSama.checked = d.ibuAlamatSama !== false;
        blokAlamatIbu.classList.toggle("tampil", !ibuAlamatSama.checked);
        if (d.alamatIbu) document.getElementById("f_alamatIbu").value = d.alamatIbu;
        ibuAlamatSama.addEventListener("change", function () { blokAlamatIbu.classList.toggle("tampil", !ibuAlamatSama.checked); });

            langkahSaatIni = 1; simpanDraft(); render();
        });
        document.getElementById("btnLanjutStep2").addEventListener("click", prosesLanjutStep2);

    function prosesLanjutStep2() {
        const ambil = function (id) { return document.getElementById(id).value.trim(); };
        const errorBox = document.getElementById("errorStep2");
        errorBox.classList.remove("tampil"); errorBox.textContent = "";

        const ayahAlmarhum = document.getElementById("f_ayahAlmarhum").checked;
        const ibuAlmarhum = document.getElementById("f_ibuAlmarhum").checked;
        const ibuAlamatSama = document.getElementById("f_ibuAlamatSama").checked;

        const namaAyah = ambil("f_namaAyah"), namaIbu = ambil("f_namaIbu"), namaWali = ambil("f_namaWali");
        const noHpAyah = ayahAlmarhum ? "" : ambil("f_noHpAyah");
        const noHpIbu = ibuAlmarhum ? "" : ambil("f_noHpIbu");
        const noHpWali = ambil("f_noHpWali");

        const kesalahan = [];
        if (!namaAyah && !namaIbu && !namaWali) kesalahan.push("Minimal salah satu data orang tua/wali (nama) wajib diisi.");
        if (!noHpAyah && !noHpIbu && !noHpWali) kesalahan.push("Minimal 1 No. HP aktif dari Ayah/Ibu/Wali wajib diisi.");
        [["No HP Ayah", noHpAyah], ["No HP Ibu", noHpIbu], ["No HP Wali", noHpWali]].forEach(function (pasangan) {
            if (pasangan[1] && !/^08\d{8,11}$/.test(pasangan[1])) kesalahan.push(pasangan[0] + " formatnya harus 08xxxxxxxxxx.");
        });

        if (kesalahan.length) {
            errorBox.innerHTML = kesalahan.join("<br>");
            errorBox.classList.add("tampil");
            return;
        }

        draft = Object.assign(draft, {
            namaAyah: namaAyah, pekerjaanAyah: ambil("f_pekerjaanAyah"), noHpAyah: noHpAyah,
            alamatAyah: ambil("f_alamatAyah"), sudahAlmarhumAyah: ayahAlmarhum ? "Ya" : "Tidak",
            namaIbu: namaIbu, pekerjaanIbu: ambil("f_pekerjaanIbu"), noHpIbu: noHpIbu,
            ibuAlamatSama: ibuAlamatSama,
            alamatIbu: ibuAlamatSama ? ambil("f_alamatAyah") : ambil("f_alamatIbu"),
            sudahAlmarhumIbu: ibuAlmarhum ? "Ya" : "Tidak",
            namaWali: namaWali, hubunganWali: ambil("f_hubunganWali"), noHpWali: noHpWali,
        });
        langkahSaatIni = 3;
        simpanDraft();
        render();
    }

    function setupStep3() {
        const d = draft;

        // Kelas peminatan
        let kelasTerpilih = d.kelasPeminatan || "";
        function renderPilihanKelas() {
            document.querySelectorAll("#daftarKelasPeminatan .pilihan-kartu").forEach(function (el) {
                el.classList.toggle("aktif", el.getAttribute("data-kelas") === kelasTerpilih);

        document.querySelectorAll("#daftarKelasPeminatan .pilihan-kartu").forEach(function (el) {
            el.addEventListener("click", function () { kelasTerpilih = el.getAttribute("data-kelas"); renderPilihanKelas(); });
        });

        // Boarding toggle
        const toggleBoarding = document.getElementById("toggleBoarding");
        let boardingAktif = d.boarding === "Ya";
        toggleBoarding.classList.toggle("aktif", boardingAktif);
        toggleBoarding.addEventListener("click", function () {
            boardingAktif = !boardingAktif;
            toggleBoarding.classList.toggle("aktif", boardingAktif);
        });

        // BTQ conditional
        const selBtqTingkat = document.getElementById("f_btqTingkat");
        const blokBtqLanjutan = document.getElementById("blokBtqLanjutan");
        function toggleBlokBtq() { blokBtqLanjutan.style.display = selBtqTingkat.value ? "block" : "none"; }
        if (d.tingkatBacaanBtq) selBtqTingkat.value = d.tingkatBacaanBtq;
        toggleBlokBtq();
        selBtqTingkat.addEventListener("change", toggleBlokBtq);
        if (d.posisiBacaanQuran) document.getElementById("f_btqPosisi").value = d.posisiBacaanQuran;

        let hafalanTerpilih = UI.csvKeArray(d.hafalanJuzBtq);
        function renderChipHafalan() {
            document.querySelectorAll("#chipHafalan .chip").forEach(function (el) {
                el.classList.toggle("aktif", hafalanTerpilih.indexOf(el.getAttribute("data-juz")) !== -1);
            });
        }
        renderChipHafalan();
        document.querySelectorAll("#chipHafalan .chip").forEach(function (el) {
            el.addEventListener("click", function () {
                const juz = el.getAttribute("data-juz");
                const idx = hafalanTerpilih.indexOf(juz);
                if (idx === -1) hafalanTerpilih.push(juz); else hafalanTerpilih.splice(idx, 1);
                renderChipHafalan();
            });
        });

        // Nilai rapor/TKA — isi ulang dari draft
        const nilaiRaporDraft = {}; UI.csvKeArray(d.nilaiMapelRapor).forEach(function (pair) { const kv = pair.split(":"); if (kv.length === 2) nilaiRaporDraft[kv[0]] = kv[1]; });
        document.querySelectorAll("[data-mapel-rapor]").forEach(function (el) {
            const m = el.getAttribute("data-mapel-rapor");
            if (nilaiRaporDraft[m]) el.value = nilaiRaporDraft[m];
        });
        const nilaiTkaDraft = {}; UI.csvKeArray(d.nilaiMapelTka).forEach(function (pair) { const kv = pair.split(":"); if (kv.length === 2) nilaiTkaDraft[kv[0]] = kv[1]; });
        document.querySelectorAll("[data-mapel-tka]").forEach(function (el) {
            const m = el.getAttribute("data-mapel-tka");
            if (nilaiTkaDraft[m]) el.value = nilaiTkaDraft[m];
        });
        if (d.prestasi) document.getElementById("f_prestasi").value = d.prestasi;

        document.getElementById("btnKembaliStep3").addEventListener("click", function () {
            langkahSaatIni = 2; simpanDraft(); render();
        });
        document.getElementById("btnLanjutStep3").addEventListener("click", function () {
            prosesLanjutStep3(kelasTerpilih, boardingAktif, hafalanTerpilih);
        });
    }

    function prosesLanjutStep3(kelasTerpilih, boardingAktif, hafalanTerpilih) {
        const errorBox = document.getElementById("errorStep3");
        errorBox.classList.remove("tampil"); errorBox.textContent = "";
        const kesalahan = [];

        if (!kelasTerpilih) kesalahan.push("Kelas peminatan wajib dipilih.");

        const kumpulkanNilai = function (selektor, batasNama) {
            const hasil = []; const peringatan = [];
            document.querySelectorAll(selektor).forEach(function (el) {
                const nilai = el.value.trim();
                if (!nilai) return;
                if (!/^\d{1,3}(\.\d+)?$/.test(nilai)) { peringatan.push(batasNama + " " + el.getAttribute(batasNama === "Rapor" ? "data-mapel-rapor" : "data-mapel-tka") + " harus angka (titik untuk desimal, bukan koma)."); return; }
                const mapel = el.getAttribute(batasNama === "Rapor" ? "data-mapel-rapor" : "data-mapel-tka");
                hasil.push(mapel + ":" + nilai);
            });
            return { csv: hasil.join(","), peringatan: peringatan };
        };
        const rapor = kumpulkanNilai("[data-mapel-rapor]", "Rapor");
        const tka = kumpulkanNilai("[data-mapel-tka]", "TKA");
        kesalahan.push(...rapor.peringatan, ...tka.peringatan);

        if (kesalahan.length) {
            errorBox.innerHTML = kesalahan.join("<br>");
            errorBox.classList.add("tampil");
            return;
        }

        draft = Object.assign(draft, {
            kelasPeminatan: kelasTerpilih,
            boarding: boardingAktif ? "Ya" : "Tidak",
            tingkatBacaanBtq: document.getElementById("f_btqTingkat").value,
            posisiBacaanQuran: document.getElementById("f_btqPosisi") ? document.getElementById("f_btqPosisi").value : "",
            hafalanJuzBtq: hafalanTerpilih.join(","),
            nilaiMapelRapor: rapor.csv,
            nilaiMapelTka: tka.csv,
            prestasi: document.getElementById("f_prestasi").value.trim(),
        });
        langkahSaatIni = 4;
        simpanDraft();
        render();
    }

            <div class="tombol-baris">

    function setupStep4() {
        document.querySelectorAll("[data-ubah]").forEach(function (el) {
            el.addEventListener("click", function () {
                langkahSaatIni = Number(el.getAttribute("data-ubah"));
                simpanDraft(); render();
            });
        });
        const cbPernyataan = document.getElementById("f_pernyataan");
        const btnKirim = document.getElementById("btnKirim");
        cbPernyataan.addEventListener("change", function () { btnKirim.disabled = !cbPernyataan.checked; });

        document.getElementById("btnKembaliStep4").addEventListener("click", function () {
            langkahSaatIni = 3; simpanDraft(); render();
        });
        btnKirim.addEventListener("click", prosesKirimPendaftaran);
    }

    async function prosesKirimPendaftaran() {
        if (sedangKirim) return;
        sedangKirim = true;
        const btnKirim = document.getElementById("btnKirim");
        const errorBox = document.getElementById("errorStep4");
        btnKirim.disabled = true;
        btnKirim.innerHTML = UI.ikon("spinner") + " Memproses…";

        try {
            const payload = Object.assign({}, draft);
            // Buang field internal (prefiks _) yang cuma dipakai utk UX form,
            // TIDAK boleh terkirim ke server (Bagian 18.2: field dokumen &
            // internal dibuang sebelum kirim).
            Object.keys(payload).forEach(function (k) { if (k.indexOf("_") === 0) delete payload[k]; });

            const res = await API.submitPendaftaran(payload);
            if (!res.ok) {
                errorBox.textContent = res.pesan || "Gagal mengirim pendaftaran.";
                errorBox.classList.add("tampil");
                btnKirim.disabled = false;
                btnKirim.innerHTML = "Kirim Pendaftaran";
                sedangKirim = false;
                return;
            }

            // Sukses — simpan info akun utk halaman sukses, HAPUS draft
            // (Bagian 9: draft dihapus HANYA kalau submit sukses).
            sessionStorage.setItem("SPMB_AKUN_BARU", JSON.stringify({
                noPendaftaran: res.data.noPendaftaran,
                pin: res.data.pin,
                noHp: draft.noHp,
                namaLengkap: draft.namaLengkap,
            }));
            hapusDraft();
            window.location.href = "sukses.html";
        } catch (err) {
            errorBox.textContent = "Error jaringan: " + err.message;
            errorBox.classList.add("tampil");
            btnKirim.disabled = false;
            btnKirim.innerHTML = "Kirim Pendaftaran";
            sedangKirim = false;
        }
    }
