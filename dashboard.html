<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Pendaftar — SPMB Mudacil</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
    .bagian-judul { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.06em; color: var(--hijau-700); text-transform: uppercase; margin: 0 0 8px; }
    .baris-info { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--garis-lembut); font-size: 0.8rem; }
    .baris-info span:first-child { color: var(--tinta-lembut); }
    .baris-info span:last-child { font-weight: 700; text-align: right; word-break: break-word; }
</style>
</head>
<body>
<div class="bungkus">
    <div class="kop">
        <div class="lambang">S</div>
        <div>
            <div class="nama-sistem" id="txtNamaAplikasi">SPMB<span>Mudacil</span></div>
            <div class="nama-sekolah" id="txtNamaSekolah">SMP Muhammadiyah 2 Cilacap</div>
        </div>
    </div>

    <div id="areaMuat" class="pemuat"><div class="spinner"></div>Memuat dashboard…</div>
    <div id="areaKonten" style="display:none;"></div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
    let ringkasan = null;
    let profil = {};
    let cfgPublik = {};
    let tabAktif = "status";

    // -----------------------------------------------------------------
    // BOOTSTRAP — verifyToken WAJIB dulu (jangan percaya token client
    // masih valid cuma dari localStorage, server bisa saja sudah expire
    // duluan / token di-invalidate manual).
    // -----------------------------------------------------------------
    async function mulai() {
        if (!API.sesiInfo().adaToken) { window.location.href = "login.html"; return; }

        try {
            const [resVerify, resProfil, resConfig] = await Promise.all([
                API.verifyToken(), API.getProfile(), API.getConfig(),
            ]);

            if (!resVerify.ok || resVerify.data.role !== "pendaftar") {
                window.location.href = "login.html";
                return;
            }
            if (!resProfil.ok) {
                tampilkanErrorFatal(resProfil.pesan || "Gagal memuat data pendaftar.");
                return;
            }
            profil = resProfil.data.pendaftar;
            ringkasan = resProfil.data.ringkasanBayar || null;
            cfgPublik = (resConfig.ok && resConfig.data) ? resConfig.data : {};
            if (cfgPublik.NAMA_APLIKASI) document.getElementById("txtNamaAplikasi").innerHTML = cfgPublik.NAMA_APLIKASI;
            if (cfgPublik.NAMA_SEKOLAH) document.getElementById("txtNamaSekolah").textContent = cfgPublik.NAMA_SEKOLAH;

            document.getElementById("areaMuat").style.display = "none";
            document.getElementById("areaKonten").style.display = "block";
            render();
        } catch (err) {
            tampilkanErrorFatal("Error jaringan: " + err.message);
        }
    }

    function tampilkanErrorFatal(pesan) {
        document.getElementById("areaMuat").innerHTML =
            "<div class=\"pesan-error-umum tampil\">" + UI.escapeHtml(pesan) + "<br><br>Coba muat ulang halaman, atau <a href=\"login.html\">login ulang</a>.</div>";
    }

    function keluar() {
        const btn = document.getElementById("btnKeluar");
        if (btn) { btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Keluar…"; }
        // Hapus sesi lokal SINKRON dulu -> login.html tidak lagi melihat
        // token lama dan redirect balik ke dashboard (bug loop "tidak
        // pernah benar-benar keluar"). Panggilan ke server menyusul di
        // background, tidak menunggu (supaya tombol tidak terasa stuck).
        API.hapusSesiLokal();
        API.logout().catch(function () { /* diamkan, tidak blocking */ });
        window.location.href = "login.html";
    }

    // -----------------------------------------------------------------
    // RENDER UTAMA
    // -----------------------------------------------------------------
    function render() {
        const area = document.getElementById("areaKonten");
        area.innerHTML = `
            <div style="padding:16px;">
                <div class="hero-gelap" style="padding:16px;">
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <span class="badge hijau">${UI.escapeHtml(labelStatus(profil.STATUS_PENDAFTARAN))}</span>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <button type="button" class="gelap" id="btnLonceng" style="position:relative; padding:7px 9px;">${UI.ikon("lonceng")}<span id="titikLonceng" style="display:none; position:absolute; top:4px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--merah);"></span></button>
                            <button type="button" class="gelap" id="btnKeluar" style="padding:6px 10px; font-size:0.7rem;">${UI.ikon("keluar")} Keluar</button>
                        </div>
                    </div>
                    <h1 style="margin-top:10px; font-size:1.1rem;">${UI.escapeHtml(profil.NAMA_LENGKAP || "-")} <span style="font-weight:500; opacity:.8;">· ${UI.escapeHtml(profil.NISN || "-")}</span></h1>
                    <div class="teks-kecil" style="color:#cbd5c8;">No. Reg: ${UI.escapeHtml(profil.NO_PENDAFTARAN || "-")}</div>
                    <div class="teks-kecil" style="color:#cbd5c8;">${UI.escapeHtml(profil.ASAL_SEKOLAH || "-")}</div>
                    <hr class="garis-pisah" style="border-color:rgba(255,255,255,0.12); background:rgba(255,255,255,0.12);">
                    <div class="teks-kecil" style="color:#cbd5c8;">${UI.escapeHtml(profil.KELAS_PEMINATAN || "Peminatan belum dipilih")} · ${profil.BOARDING === "Ya" ? "Boarding" : "Non-Boarding"}</div>
                    ${htmlTombolWAAdmin()}
                </div>
            </div>

            <div style="padding:0 16px;">
                <div class="tab-bar">
                    <button type="button" class="tab-btn" data-tab="status">${UI.ikon("jam")}<span>Status</span></button>
                    <button type="button" class="tab-btn" data-tab="pembayaran">${UI.ikon("info")}<span>Bayar</span></button>
                    <button type="button" class="tab-btn" data-tab="dokumen">${UI.ikon("unggah")}<span>Dokumen</span></button>
                    <button type="button" class="tab-btn" data-tab="data">${UI.ikon("kunci")}<span>Data Saya</span></button>
                    <button type="button" class="tab-btn" data-tab="nilai">${UI.ikon("info")}<span>Nilai</span></button>
                </div>
                <div id="isiTab"></div>
            </div>
        `;

        document.getElementById("btnKeluar").addEventListener("click", keluar);
        document.getElementById("btnLonceng").addEventListener("click", bukaPengumuman);
        cekPengumumanBelumDibaca();
        document.querySelectorAll(".tab-btn").forEach(function (btn) {
            btn.addEventListener("click", function () { tabAktif = btn.getAttribute("data-tab"); render(); });
        });
        document.querySelectorAll(".tab-btn").forEach(function (btn) {
            btn.classList.toggle("aktif", btn.getAttribute("data-tab") === tabAktif);
        });

        const rute = { status: renderStatus, dokumen: renderDokumen, pembayaran: renderPembayaran, data: renderData, nilai: renderNilai };
        rute[tabAktif]();
    }

    // -----------------------------------------------------------------
    // HELPER
    // -----------------------------------------------------------------
    const LABEL_STATUS = { "Daftar Ulang": "Menunggu Daftar Ulang", "Selesai": "Diterima" };
    function labelStatus(s) { return LABEL_STATUS[s] || s || "-"; }
    function angka(v) { return parseInt(String(v == null ? "" : v).replace(/[^\d]/g, ""), 10) || 0; }
    function parseNilai(str) {
        const o = [];
        String(str || "").split(",").forEach(function (pair) {
            const kv = pair.split(":");
            if (kv.length === 2 && kv[0].trim()) o.push([kv[0].trim(), kv[1].trim()]);
        });
        return o;
    }
    // -----------------------------------------------------------------
    // PENGUMUMAN — modal + lonceng notifikasi. Status "sudah dibaca"
    // disimpan di localStorage per perangkat (tidak ada sheet pelacak
    // per-pendaftar, sengaja — tetap simpel sesuai Bagian 3 poin 16).
    // -----------------------------------------------------------------
    const KUNCI_PENGUMUMAN_DIBACA = "SPMB_PENGUMUMAN_DIBACA";
    function idPengumumanDibaca() {
        try { return JSON.parse(localStorage.getItem(KUNCI_PENGUMUMAN_DIBACA) || "[]"); } catch (e) { return []; }
    }
    async function cekPengumumanBelumDibaca() {
        try {
            const res = await API.getPengumuman(profil && profil.GELOMBANG);
            const rows = (res.ok && res.data && res.data.pengumuman) ? res.data.pengumuman : [];
            const dibaca = idPengumumanDibaca();
            const adaBaru = rows.some(function (r) { return dibaca.indexOf(r.PENGUMUMAN_ID) === -1; });
            const titik = document.getElementById("titikLonceng");
            if (titik) titik.style.display = adaBaru ? "block" : "none";
        } catch (err) { /* diamkan, ikon lonceng tetap tampil tanpa badge */ }
    }
    async function bukaPengumuman() {
        const latar = document.createElement("div");
        latar.className = "modal-latar";
        latar.innerHTML = `<div class="modal-kotak" style="max-width:420px; max-height:80vh; overflow-y:auto;">
            <h3 style="margin:0 0 10px;">${UI.ikon("lonceng")} Pengumuman</h3>
            <div id="isiModalPengumuman"><div class="pemuat"><div class="spinner"></div>Memuat…</div></div>
            <button type="button" class="blok" id="btnTutupPengumuman" style="margin-top:12px;">Tutup</button>
        </div>`;
        document.body.appendChild(latar);
        latar.querySelector("#btnTutupPengumuman").addEventListener("click", function () { latar.remove(); });
        latar.addEventListener("click", function (e) { if (e.target === latar) latar.remove(); });

        try {
            const res = await API.getPengumuman(profil && profil.GELOMBANG);
            const rows = (res.ok && res.data && res.data.pengumuman) ? res.data.pengumuman : [];
            const isi = document.getElementById("isiModalPengumuman");
            isi.innerHTML = rows.length ? rows.map(function (r) {
                return `<div class="kartu" style="margin-bottom:8px;">
                    <div style="font-weight:800;">${UI.escapeHtml(r.JUDUL)}</div>
                    <p class="teks-lembut" style="margin:4px 0;">${UI.escapeHtml(r.ISI || "")}</p>
                    ${r.LINK_WA ? `<a href="${UI.escapeHtml(r.LINK_WA)}" target="_blank" rel="noreferrer" class="tombol utama blok" style="margin-top:6px;">${UI.ikon("panah")} Buka Link</a>` : ""}
                </div>`;
            }).join("") : '<div class="teks-lembut" style="text-align:center;">Belum ada pengumuman.</div>';

            // Tandai semua sudah dibaca begitu modal dibuka
            const sudah = idPengumumanDibaca();
            rows.forEach(function (r) { if (sudah.indexOf(r.PENGUMUMAN_ID) === -1) sudah.push(r.PENGUMUMAN_ID); });
            localStorage.setItem(KUNCI_PENGUMUMAN_DIBACA, JSON.stringify(sudah));
            const titik = document.getElementById("titikLonceng");
            if (titik) titik.style.display = "none";
        } catch (err) {
            document.getElementById("isiModalPengumuman").innerHTML = '<div class="pesan-error-umum tampil">Gagal memuat pengumuman.</div>';
        }
    }

    /** Tombol kecil "Hubungi Admin" — tampil di header, ada di semua tab. */
    function htmlTombolWAAdmin() {
        const nomor = cfgPublik.ADMIN_WA_1_NOMOR;
        if (!nomor) return "";
        const pesan = "Assalamu'alaikum, saya " + (profil.NAMA_LENGKAP || "") + " (No. Pendaftaran " + (profil.NO_PENDAFTARAN || "") + ") ingin bertanya.";
        return `<a class="tombol tombol-wa blok" style="margin-top:10px; font-size:0.72rem;" target="_blank" rel="noreferrer" href="${UI.linkWA(nomor, cfgPublik.ADMIN_WA_1_NAMA, pesan)}">${UI.ikon("wa")} Hubungi Admin SPMB</a>`;
    }

    function tombolBuka(jenis, id, teks) {
        return `<button type="button" class="tombol teks" data-buka="${jenis}" data-id="${UI.escapeHtml(id)}" style="padding-left:0;">${teks} ${UI.ikon("panah")}</button>`;
    }
    function pasangTombolBuka(wadah) {
        wadah.querySelectorAll("[data-buka]").forEach(function (t) {
            t.addEventListener("click", async function () {
                const asal = t.innerHTML;
                t.disabled = true; t.innerHTML = UI.ikon("spinner") + " Membuka…";
                await UI.bukaFile(t.getAttribute("data-buka"), t.getAttribute("data-id"));
                t.disabled = false; t.innerHTML = asal;
            });
        });
    }

    // -----------------------------------------------------------------
    // TAB STATUS — dua jalur terpisah supaya tidak ambigu:
    //  1) Penerimaan (ditentukan PEMBAYARAN)  2) Verifikasi dokumen (tidak
    //  memengaruhi penerimaan).
    // -----------------------------------------------------------------
    async function renderStatus() {
        const isiTab = document.getElementById("isiTab");
        isiTab.innerHTML = '<div class="pemuat"><div class="spinner"></div>Memuat status…</div>';

        let dokumenRows = [];
        try {
            const res = await API.getDokumen();
            dokumenRows = (res.ok && res.data && res.data.dokumen) ? res.data.dokumen : [];
        } catch (err) { /* status dokumen tampil "belum diketahui" */ }

        const rb = ringkasan || {};
        let penerimaan;
        if (rb.lunas) {
            penerimaan = { judul: "Diterima", cls: "hijau", desk: "Pembayaran daftar ulang sudah lunas. Selamat bergabung di " + (cfgPublik.NAMA_SEKOLAH || "sekolah kami") + "!" };
        } else if (rb.total > 0) {
            penerimaan = { judul: "Menunggu Daftar Ulang", cls: "amber", desk: "Pembayaran diterima " + UI.formatRupiah(rb.total) + ". Sisa " + UI.formatRupiah(rb.sisa) + " untuk melunasi daftar ulang — silakan upload bukti pembayaran melalui tab Bayar, bisa dicicil kapan saja." };
        } else {
            penerimaan = { judul: "Belum Ada Pembayaran", cls: "abu", desk: "Amankan kelas pilihanmu sekarang dengan membayar DP minimal " + UI.formatRupiah(cfgPublik.BIAYA_DP_MIN) + ". Buka tab Bayar." };
        }

        const wajib = UI.csvKeArray(cfgPublik.JENIS_DOKUMEN_LIST);
        const valid = wajib.filter(function (j) { return dokumenRows.some(function (d) { return d.JENIS_DOKUMEN === j && d.STATUS === "Valid"; }); }).length;
        const perbaikan = dokumenRows.filter(function (d) { return d.STATUS === "Perlu Perbaikan"; });
        const terupload = wajib.filter(function (j) { return dokumenRows.some(function (d) { return d.JENIS_DOKUMEN === j; }); }).length;
        let dok;
        if (perbaikan.length) dok = { judul: "Perlu Perbaikan", cls: "amber", desk: perbaikan.length + " dokumen perlu diupload ulang. Lihat catatan petugas di tab Dokumen." };
        else if (wajib.length && valid === wajib.length) dok = { judul: "Semua Dokumen Valid", cls: "hijau", desk: "Seluruh dokumen wajib sudah diperiksa dan valid." };
        else dok = { judul: valid + " dari " + wajib.length + " dokumen valid", cls: "biru", desk: terupload < wajib.length ? "Lengkapi dokumen di tab Dokumen (" + terupload + "/" + wajib.length + " sudah diupload)." : "Semua dokumen sudah diupload, menunggu pemeriksaan petugas." };

        isiTab.innerHTML = `
            <h3 style="margin-bottom:10px;">Status Pendaftaran</h3>
            <div class="kartu">
                <div class="bagian-judul">1. Penerimaan</div>
                <span class="badge ${penerimaan.cls}">${UI.escapeHtml(penerimaan.judul)}</span>
                <p class="teks-lembut" style="margin:8px 0 0;">${UI.escapeHtml(penerimaan.desk)}</p>
            </div>
            <div class="kartu">
                <div class="bagian-judul">2. Kelengkapan Dokumen</div>
                <span class="badge ${dok.cls}">${UI.escapeHtml(dok.judul)}</span>
                <p class="teks-lembut" style="margin:8px 0 0;">${UI.escapeHtml(dok.desk)}</p>
            </div>
            <div class="catatan hijau">${UI.ikon("info")}<span>Status <strong>Diterima</strong> muncul begitu pembayaran daftar ulang lunas. Kelengkapan dokumen tetap perlu dipenuhi, tetapi tidak memengaruhi status penerimaan.</span></div>
        `;
    }

    // -----------------------------------------------------------------
    // TAB PEMBAYARAN — "Amankan Kelas"
    // -----------------------------------------------------------------
    async function renderPembayaran() {
        const isiTab = document.getElementById("isiTab");
        isiTab.innerHTML = '<div class="pemuat"><div class="spinner"></div>Memuat pembayaran…</div>';

        let rows = [];
        try {
            const res = await API.getPembayaran();
            rows = (res.ok && res.data && res.data.pembayaran) ? res.data.pembayaran : [];
        } catch (err) {
            isiTab.innerHTML = '<div class="pesan-error-umum tampil">Gagal memuat riwayat pembayaran.</div>';
            return;
        }
        const rb = ringkasan || {};
        const rekening = [cfgPublik.REKENING_1, cfgPublik.REKENING_2].filter(Boolean);

        isiTab.innerHTML = `
            <div class="kartu-akun-gelap">
                <div class="label-mini">Amankan Kelas Sekarang</div>
                <div class="nilai-besar" style="font-size:1.1rem;">Bayar DP minimal ${UI.formatRupiah(cfgPublik.BIAYA_DP_MIN)}</div>
                <div class="teks-kecil" style="color:#cbd5c8; margin-top:6px;">Kursi kelas pilihanmu terjamin setelah DP dikonfirmasi. Sisa biaya boleh dicicil sampai lunas.</div>
                ${rekening.length ? `<div style="margin-top:8px;">${rekening.map(UI.htmlRekening).join("")}</div>` : ""}
            </div>

            <div class="kartu" style="margin-top:12px;">
                <div class="bagian-judul">Rincian Biaya Daftar Ulang</div>
                <div class="baris-info"><span>Biaya pendaftaran</span><span>${UI.formatRupiah(rb.biaya || 0)}</span></div>
                ${rb.potongan ? `<div class="baris-info"><span>Potongan${rb.keteranganPotongan ? " — " + UI.escapeHtml(rb.keteranganPotongan) : ""}</span><span>- ${UI.formatRupiah(rb.potongan)}</span></div>` : ""}
                <div class="baris-info"><span>Yang harus dibayar</span><span>${UI.formatRupiah(rb.ambang || 0)}</span></div>
                <div class="baris-info"><span>Sudah dibayar (terkonfirmasi)</span><span>${UI.formatRupiah(rb.total || 0)}</span></div>
                <div class="baris-info"><span>Sisa</span><span style="color:${rb.sisa ? "var(--merah)" : "var(--hijau-700)"};">${UI.formatRupiah(rb.sisa || 0)}</span></div>
                ${rb.menungguKonfirmasi ? `<div class="teks-kecil" style="margin-top:6px;">${rb.menungguKonfirmasi} pembayaran menunggu konfirmasi petugas.</div>` : ""}
            </div>

            <h3 style="margin-top:16px;">Riwayat Pembayaran</h3>
            <div id="daftarPembayaran">
                ${rows.length === 0 ? '<div class="kartu teks-lembut" style="text-align:center;">Belum ada pembayaran tercatat.</div>' :
                    rows.map(function (p) {
                        const cls = p.STATUS_KONFIRMASI === "Dikonfirmasi" ? "hijau" : (p.STATUS_KONFIRMASI === "Ditolak" ? "merah" : "amber");
                        return `<div class="kartu" style="margin-bottom:8px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="font-weight:800; font-size:0.8rem;">${UI.escapeHtml(p.JENIS)} · ${UI.escapeHtml(p.METODE || "")}</span>
                                <span style="font-weight:800; color:var(--hijau-700);">${UI.formatRupiah(p.NOMINAL)}</span>
                            </div>
                            <div class="teks-kecil">${UI.formatTanggal(p.TANGGAL)}</div>
                            ${p.BUKTI_URL ? tombolBuka("bukti", p.PAYMENT_ID, "Lihat bukti") : ""}
                            <span class="badge ${cls}" style="margin-top:4px;">${UI.escapeHtml(p.STATUS_KONFIRMASI)}</span>
                        </div>`;
                    }).join("")}
            </div>

            <button type="button" class="utama blok" id="btnUploadBayar" style="margin-top:14px;">${UI.ikon("unggah")} Upload Bukti Pembayaran</button>
            <div id="formUploadBayar" style="display:none; margin-top:12px;">
                <label style="margin-top:0;">Jenis Pembayaran</label>
                <select id="f_jenisBayar"><option value="DP">DP</option><option value="Daftar Ulang">Daftar Ulang (cicilan / pelunasan)</option></select>
                <label>Metode</label>
                <select id="f_metodeBayar"><option value="Transfer">Transfer</option><option value="Tunai">Tunai</option></select>
                <label>Nominal (Rp)</label>
                <input type="text" id="f_nominalBayar" inputmode="numeric" placeholder="mis. 100000">
                <label>Bukti Transfer <span class="opsional">(wajib untuk transfer)</span></label>
                <input type="file" id="f_fileBayar" accept=".jpg,.jpeg,.png,.pdf">
                <div class="pesan-error-umum" id="errorBayar"></div>
                <button type="button" class="utama blok" id="btnKirimBayar" style="margin-top:12px;">Kirim</button>
            </div>
        `;
        pasangTombolBuka(isiTab);
        isiTab.querySelectorAll("[data-salin-rekening]").forEach(function (btn) {
            btn.addEventListener("click", function () { UI.salin(btn.getAttribute("data-salin-rekening").replace(/\D/g, ""), "Nomor rekening tersalin."); });
        });

        document.getElementById("btnUploadBayar").addEventListener("click", function () {
            document.getElementById("formUploadBayar").style.display = "block";
            document.getElementById("btnUploadBayar").style.display = "none";
        });

        document.getElementById("btnKirimBayar").addEventListener("click", async function () {
            const jenis = document.getElementById("f_jenisBayar").value;
            const metode = document.getElementById("f_metodeBayar").value;
            const nominal = angka(document.getElementById("f_nominalBayar").value);
            const file = document.getElementById("f_fileBayar").files[0];
            const errorBox = document.getElementById("errorBayar");
            errorBox.classList.remove("tampil");

            if (!nominal) { errorBox.textContent = "Nominal wajib diisi berupa angka."; errorBox.classList.add("tampil"); return; }
            if (metode === "Transfer" && !file) { errorBox.textContent = "Bukti transfer wajib diupload."; errorBox.classList.add("tampil"); return; }

            const btn = document.getElementById("btnKirimBayar");
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Mengirim…";
            try {
                const res = await API.uploadBuktiPembayaran(jenis, metode, String(nominal), file);
                if (!res.ok) {
                    errorBox.textContent = res.pesan || "Gagal mengirim.";
                    errorBox.classList.add("tampil");
                    btn.disabled = false; btn.textContent = "Kirim";
                    return;
                }
                UI.toast("Bukti pembayaran terkirim, menunggu konfirmasi petugas.");
                renderPembayaran();
            } catch (err) {
                errorBox.textContent = "Error jaringan: " + err.message;
                errorBox.classList.add("tampil");
                btn.disabled = false; btn.textContent = "Kirim";
            }
        });
    }

    // -----------------------------------------------------------------
    // TAB DOKUMEN
    // -----------------------------------------------------------------
    async function renderDokumen() {
        const isiTab = document.getElementById("isiTab");
        isiTab.innerHTML = '<div class="pemuat"><div class="spinner"></div>Memuat dokumen…</div>';

        const jenisWajib = UI.csvKeArray(cfgPublik.JENIS_DOKUMEN_LIST);
        const jenisOpsional = UI.csvKeArray(cfgPublik.JENIS_DOKUMEN_OPSIONAL || "BUKTI_PRESTASI");
        let dokumenRows = [];
        try {
            const res = await API.getDokumen();
            dokumenRows = (res.ok && res.data && res.data.dokumen) ? res.data.dokumen : [];
        } catch (err) {
            isiTab.innerHTML = '<div class="pesan-error-umum tampil">Gagal memuat daftar dokumen.</div>';
            return;
        }
        // Dokumen opsional (mis. bukti prestasi) hanya muncul kalau Prestasi diisi
        const adaPrestasi = !!String(profil.PRESTASI || "").trim();
        const daftarJenis = jenisWajib.map(function (j) { return [j, false]; })
            .concat(jenisOpsional.filter(function () { return adaPrestasi; }).map(function (j) { return [j, true]; }));

        function metaStatus(status) {
            if (status === "Valid") return { label: "Valid", cls: "hijau", tombol: "Terkunci", disabled: true };
            if (status === "Perlu Perbaikan") return { label: "Perlu Perbaikan", cls: "amber", tombol: "Upload Ulang", disabled: false };
            if (status === "Menunggu Verifikasi") return { label: "Menunggu Verifikasi", cls: "biru", tombol: "Ganti File", disabled: false };
            return { label: "Belum Upload", cls: "abu", tombol: "Upload", disabled: false };
        }

        isiTab.innerHTML = `
            <h3 style="margin-bottom:6px;">Dokumen Saya</h3>
            <p class="teks-lembut" style="margin-top:0;">Format jpg/jpeg/png/pdf, maks ${APP_CONFIG.maxUploadMB || 2}MB. Dokumen diperiksa petugas; status <strong>Diterima</strong> ditentukan oleh pembayaran, bukan oleh dokumen.</p>
            ${adaPrestasi ? '<div class="catatan hijau">' + UI.ikon("info") + '<span>Karena kamu mengisi data prestasi, silakan upload bukti prestasi (opsional).</span></div>' : ""}
            <div id="daftarDokumen"></div>
        `;
        const daftarEl = document.getElementById("daftarDokumen");

        function gambarUlang() {
            daftarEl.innerHTML = daftarJenis.map(function (item) {
                const jenis = item[0], opsional = item[1];
                const row = dokumenRows.find(function (r) { return r.JENIS_DOKUMEN === jenis; });
                const meta = metaStatus(row ? row.STATUS : "Belum Upload");
                return `
                    <div class="baris-dokumen">
                        <div style="min-width:0; flex:1;">
                            <div class="nama">${UI.escapeHtml(jenis)}${opsional ? ' <span class="opsional">(opsional)</span>' : ""}</div>
                            <span class="badge ${meta.cls}" style="margin-top:6px;">${meta.label}</span>
                            ${row && row.FILE_URL ? '<div>' + tombolBuka("dokumen", row.DOKUMEN_ID, "Lihat file yang diupload") + '</div>' : ""}
                            ${row && row.CATATAN_PETUGAS ? `<div class="catatan-petugas">"${UI.escapeHtml(row.CATATAN_PETUGAS)}"</div>` : ""}
                        </div>
                        <label class="tombol utama" style="font-size:0.7rem; padding:9px 12px; ${meta.disabled ? "opacity:.5; cursor:not-allowed;" : ""}">
                            ${meta.tombol}
                            <input type="file" accept=".jpg,.jpeg,.png,.pdf" data-jenis="${UI.escapeHtml(jenis)}" style="display:none;" ${meta.disabled ? "disabled" : ""}>
                        </label>
                    </div>
                `;
            }).join("");
            pasangTombolBuka(daftarEl);

            daftarEl.querySelectorAll('input[type="file"]').forEach(function (inp) {
                inp.addEventListener("change", async function () {
                    if (!inp.files || !inp.files[0]) return;
                    const jenis = inp.getAttribute("data-jenis");
                    const label = inp.closest("label");
                    label.style.pointerEvents = "none";
                    label.firstChild.textContent = "";
                    label.insertAdjacentHTML("afterbegin", UI.ikon("spinner") + " Mengupload…");
                    try {
                        const res = await API.uploadDokumen(jenis, inp.files[0]);
                        if (!res.ok) { UI.toast(res.pesan || "Upload gagal.", "error"); gambarUlang(); return; }
                        UI.toast("Dokumen berhasil diupload.");
                        const resUlang = await API.getDokumen();
                        dokumenRows = (resUlang.ok && resUlang.data && resUlang.data.dokumen) ? resUlang.data.dokumen : dokumenRows;
                        gambarUlang();
                    } catch (err) {
                        UI.toast("Error jaringan: " + err.message, "error");
                        gambarUlang();
                    }
                });
            });
        }
        gambarUlang();
    }

    // -----------------------------------------------------------------
    // TAB NILAI — nilai yang SUDAH TERISI dikunci (hanya petugas yang bisa
    // koreksi lewat Ajukan Perubahan Data); yang MASIH KOSONG bisa diisi
    // sendiri langsung tersimpan (lihat isiNilaiKosongHandler).
    // -----------------------------------------------------------------
    function renderNilai() {
        const isiTab = document.getElementById("isiTab");
        const p = profil;

        function blokIsiNilai(judul, kolom, daftarMapelCfg) {
            const existing = {};
            parseNilai(p[kolom]).forEach(function (x) { existing[x[0]] = x[1]; });
            const semuaMapel = UI.csvKeArray(daftarMapelCfg);
            Object.keys(existing).forEach(function (m) { if (semuaMapel.indexOf(m) === -1) semuaMapel.push(m); });
            const terisi = semuaMapel.filter(function (m) { return existing[m] !== undefined; });
            const kosong = semuaMapel.filter(function (m) { return existing[m] === undefined; });
            const vals = terisi.map(function (m) { return parseFloat(String(existing[m]).replace(",", ".")); }).filter(function (v) { return !isNaN(v); });
            const tot = vals.reduce(function (a, b) { return a + b; }, 0);

            return `<div class="kartu">
                <div class="bagian-judul">${judul}</div>
                ${terisi.length ? terisi.map(function (m) { return `<div class="baris-info"><span>${UI.escapeHtml(m)}</span><span>${UI.escapeHtml(existing[m])}</span></div>`; }).join("") : '<div class="teks-lembut">Belum ada nilai terisi.</div>'}
                ${vals.length ? `<div class="ringkasan-nilai"><span>Total: <strong>${tot.toFixed(2)}</strong></span><span>Rata-rata: <strong>${(tot / vals.length).toFixed(2)}</strong></span></div>` : ""}
                ${kosong.length ? `
                    <div class="bagian-judul" style="margin-top:14px;">Lengkapi yang Masih Kosong</div>
                    ${kosong.map(function (m) { return `<div class="field"><label style="margin-top:4px; font-size:0.72rem;">${UI.escapeHtml(m)}</label><input type="text" inputmode="decimal" data-isi-nilai="${kolom}" data-mapel="${UI.escapeHtml(m)}" placeholder="0-100"></div>`; }).join("")}
                ` : '<div class="teks-kecil" style="margin-top:8px;">Semua nilai sudah terisi.</div>'}
            </div>`;
        }

        isiTab.innerHTML = `
            <h3>Nilai &amp; Prestasi</h3>
            <div class="catatan hijau">${UI.ikon("info")}<span>Nilai yang sudah terisi terkunci di sini — kalau keliru, ajukan koreksi lewat tab Data Saya. Yang masih kosong bisa langsung diisi &amp; tersimpan.</span></div>
            ${blokIsiNilai("Nilai Rapor", "NILAI_MAPEL_RAPOR", cfgPublik.MAPEL_RAPOR_LIST)}
            ${blokIsiNilai("Nilai TKA", "NILAI_MAPEL_TKA", cfgPublik.MAPEL_TKA_LIST)}
            <div class="kartu">
                <div class="bagian-judul">Prestasi</div>
                ${String(p.PRESTASI || "").trim()
                    ? `<div class="teks-lembut">${UI.escapeHtml(p.PRESTASI)}</div>`
                    : `<textarea id="f_prestasiBaru" rows="2" placeholder="Tulis prestasi yang pernah diraih (opsional)"></textarea>`}
            </div>
            <div class="pesan-error-umum" id="errorNilai"></div>
            <button type="button" class="utama blok" id="btnSimpanNilai" style="margin-top:10px;">Simpan Nilai Baru</button>
        `;

        document.getElementById("btnSimpanNilai").addEventListener("click", async function () {
            const errorBox = document.getElementById("errorNilai");
            errorBox.classList.remove("tampil");
            const kumpul = { NILAI_MAPEL_RAPOR: [], NILAI_MAPEL_TKA: [] };
            let salah = false;
            document.querySelectorAll("[data-isi-nilai]").forEach(function (el) {
                const v = el.value.trim().replace(",", ".");
                if (!v) return;
                const kolom = el.getAttribute("data-isi-nilai");
                const maksNilai = kolom === "NILAI_MAPEL_TKA" ? 1000 : 100; // TKA pakai skor (bukan skala 100) -> tiap mapel bisa sampai 1000
                if (isNaN(parseFloat(v)) || parseFloat(v) < 0 || parseFloat(v) > maksNilai) salah = true;
                kumpul[kolom].push(el.getAttribute("data-mapel") + ":" + v);
            });
            if (salah) { errorBox.textContent = "Nilai Rapor harus 0-100, nilai TKA harus 0-1000."; errorBox.classList.add("tampil"); return; }
            const prestasiEl = document.getElementById("f_prestasiBaru");
            const prestasiBaru = prestasiEl ? prestasiEl.value.trim() : "";
            if (!kumpul.NILAI_MAPEL_RAPOR.length && !kumpul.NILAI_MAPEL_TKA.length && !prestasiBaru) {
                errorBox.textContent = "Isi minimal satu nilai atau prestasi dulu.";
                errorBox.classList.add("tampil");
                return;
            }
            const btn = document.getElementById("btnSimpanNilai");
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Menyimpan…";
            try {
                const res = await API.isiNilaiKosong(kumpul.NILAI_MAPEL_RAPOR.join(","), kumpul.NILAI_MAPEL_TKA.join(","), prestasiBaru);
                if (!res.ok) throw new Error(res.pesan);
                UI.toast("Nilai berhasil disimpan.");
                const resProfil = await API.getProfile();
                if (resProfil.ok) profil = resProfil.data.pendaftar;
                renderNilai();
            } catch (err) {
                errorBox.textContent = err.message || "Gagal menyimpan.";
                errorBox.classList.add("tampil");
                btn.disabled = false; btn.textContent = "Simpan Nilai Baru";
            }
        });
    }

    /** Unduh Bukti Pendaftaran (Nama, TTL, NISN, Asal Sekolah, No. Reg, Kelas, Boarding, ringkasan nilai). */
    function unduhBuktiPendaftaran() {
        const p = profil;
        function statNilai(str) {
            const vals = parseNilai(str).map(function (x) { return parseFloat(x[1].replace(",", ".")); }).filter(function (v) { return !isNaN(v); });
            if (!vals.length) return "Belum diisi";
            const tot = vals.reduce(function (a, b) { return a + b; }, 0);
            return vals.length + " nilai — Jumlah: " + tot.toFixed(2) + " — Rata-rata: " + (tot / vals.length).toFixed(2);
        }
        const baris = [
            ["NISN", p.NISN], ["Nomor Pendaftaran", p.NO_PENDAFTARAN], ["Tempat, Tanggal Lahir", p.TEMPAT_TGL_LAHIR],
            ["Asal Sekolah", p.ASAL_SEKOLAH], ["Kelas Peminatan", p.KELAS_PEMINATAN],
            ["Boarding", p.BOARDING === "Ya" ? "Ya" : "Tidak"],
            ["Nilai Rapor", statNilai(p.NILAI_MAPEL_RAPOR)], ["Nilai TKA", statNilai(p.NILAI_MAPEL_TKA)],
        ];
        UI.cetakHalaman(
            "Bukti Pendaftaran - " + p.NAMA_LENGKAP,
            `<div style="text-align:center; font-size:1.25rem; font-weight:800; margin-bottom:18px;">${UI.escapeHtml(p.NAMA_LENGKAP)}</div>
            <table>${baris.map(function (b) { return `<tr><td>${UI.escapeHtml(b[0])}</td><td>${UI.escapeHtml(b[1] == null || b[1] === "" ? "-" : String(b[1]))}</td></tr>`; }).join("")}</table>`,
            { judulDok: "BUKTI PENDAFTARAN", subJudul1: "SPMB TA " + (cfgPublik.TAHUN_AJARAN || "-"), subJudul2: (cfgPublik.NAMA_SEKOLAH || "").toUpperCase() }
        );
    }

    // -----------------------------------------------------------------
    // TAB DATA SAYA — SEMUA data terlihat (agar kalau ada kesalahan bisa
    // diajukan koreksi) + "Ajukan Perubahan Data" (Bagian 13).
    // -----------------------------------------------------------------
    function renderData() {
        const isiTab = document.getElementById("isiTab");
        const p = profil;
        const bagian = [
            ["Data Calon Siswa", [
                ["Nama Lengkap", p.NAMA_LENGKAP], ["NISN", p.NISN], ["Jenis Kelamin", p.JENIS_KELAMIN],
                ["Tempat, Tanggal Lahir", p.TEMPAT_TGL_LAHIR], ["Asal Sekolah", p.ASAL_SEKOLAH], ["Alamat", UI.tampilAlamat(p.ALAMAT)],
                ["Anak ke-", p.ANAK_KE], ["Jumlah Saudara", p.JUMLAH_SAUDARA], ["No. HP", p.NO_HP], ["Email", p.EMAIL],
            ]],
            ["Data Ayah", [
                ["Nama", p.NAMA_AYAH], ["Pekerjaan", p.PEKERJAAN_AYAH], ["No. HP", p.NO_HP_AYAH], ["Alamat", UI.tampilAlamat(p.ALAMAT_AYAH)],
                ["Almarhum", p.SUDAH_ALMARHUM_AYAH],
            ]],
            ["Data Ibu", [
                ["Nama", p.NAMA_IBU], ["Pekerjaan", p.PEKERJAAN_IBU], ["No. HP", p.NO_HP_IBU], ["Alamat", UI.tampilAlamat(p.ALAMAT_IBU)],
                ["Almarhum", p.SUDAH_ALMARHUM_IBU],
            ]],
            ["Data Wali", [["Nama", p.NAMA_WALI], ["Hubungan", p.HUBUNGAN_WALI], ["No. HP", p.NO_HP_WALI]]],
            ["Pilihan Sekolah & BTQ", [
                ["Kelas Peminatan", p.KELAS_PEMINATAN], ["Program", p.BOARDING === "Ya" ? "Boarding" : "Non-Boarding"],
                ["Gelombang", p.GELOMBANG], ["Tingkat Bacaan BTQ", p.TINGKAT_BACAAN_BTQ],
                ["Posisi Bacaan", p.POSISI_BACAAN_QURAN], ["Hafalan (Juz)", p.HAFALAN_JUZ_BTQ],
            ]],
        ];

        isiTab.innerHTML = `
            <h3>Data Saya</h3>
            ${bagian.map(function (b) {
                return `<div class="kartu"><div class="bagian-judul">${b[0]}</div>
                    ${b[1].map(function (r) {
                        return `<div class="baris-info"><span>${UI.escapeHtml(r[0])}</span><span>${UI.escapeHtml(r[1] == null || r[1] === "" ? "-" : r[1])}</span></div>`;
                    }).join("")}</div>`;
            }).join("")}
            <button type="button" class="tombol blok" id="btnUnduhBukti" style="margin-bottom:12px;">${UI.ikon("unggah")} Unduh Bukti Pendaftaran</button>
            <div class="catatan hijau">${UI.ikon("info")}<span>Nilai Rapor, TKA, dan Prestasi sekarang ada di tab <strong>Nilai</strong> tersendiri. Ada data lain yang keliru di atas? Ajukan perubahan di bawah, petugas akan memprosesnya.</span></div>
            <button type="button" class="tombol blok" id="btnAjukanUbah" style="margin-top:12px;">Ajukan Perubahan Data</button>
            <div id="formAjukanUbah" style="display:none; margin-top:12px;">
                <div class="catatan amber">${UI.ikon("info")}<span>Perubahan akan masuk ke antrean petugas, tidak langsung berubah.</span></div>
                <label style="margin-top:0;">Bagian yang ingin diubah</label>
                <input type="text" id="f_fieldUbah" placeholder="Contoh: Alamat / No. HP Ayah / Nilai Rapor">
                <label>Perubahan yang diminta</label>
                <textarea id="f_isiUbah" rows="3" placeholder="Tulis data yang benar"></textarea>
                <div class="pesan-error-umum" id="errorUbah"></div>
                <button type="button" class="utama blok" id="btnKirimUbah" style="margin-top:12px;">Kirim Pengajuan</button>
            </div>
        `;

        document.getElementById("btnUnduhBukti").addEventListener("click", unduhBuktiPendaftaran);

        document.getElementById("btnAjukanUbah").addEventListener("click", function () {
            document.getElementById("formAjukanUbah").style.display = "block";
            document.getElementById("btnAjukanUbah").style.display = "none";
        });

        document.getElementById("btnKirimUbah").addEventListener("click", async function () {
            const field = document.getElementById("f_fieldUbah").value.trim();
            const isi = document.getElementById("f_isiUbah").value.trim();
            const errorBox = document.getElementById("errorUbah");
            errorBox.classList.remove("tampil");
            if (!field || !isi) {
                errorBox.textContent = "Mohon isi bagian yang diubah dan detail perubahannya.";
                errorBox.classList.add("tampil");
                return;
            }
            const btn = document.getElementById("btnKirimUbah");
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Mengirim…";
            try {
                const res = await API.updateProfile({ field: field, perubahan: isi });
                if (!res.ok) throw new Error(res.pesan);
                UI.toast("Pengajuan perubahan data terkirim.");
                renderData();
            } catch (err) {
                errorBox.textContent = err.message || "Gagal mengirim pengajuan.";
                errorBox.classList.add("tampil");
                btn.disabled = false; btn.textContent = "Kirim Pengajuan";
            }
        });
    }

    mulai();
</script>
</body>
</html>
