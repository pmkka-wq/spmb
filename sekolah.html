<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Sekolah — SPMB Mudacil</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
    /* Dashboard sekolah dipakai di layar lebih lebar juga (petugas biasa
       kerja dari laptop) — lebar bungkus dilonggarkan khusus di sini. */
    .bungkus { max-width: 720px; }
    table.tabel-data { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    table.tabel-data th { text-align: left; padding: 8px 6px; color: var(--tinta-samar); font-size: 0.68rem; text-transform: uppercase; border-bottom: 1px solid var(--garis); }
    table.tabel-data td { padding: 9px 6px; border-bottom: 1px solid var(--garis-lembut); }
    table.tabel-data tr:hover td { background: var(--hijau-50); cursor: pointer; }
    .subtab-bar { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--garis); }
    .subtab-btn { border: none; background: none; padding: 10px 4px; font-weight: 800; font-size: 0.78rem; color: var(--tinta-samar); border-bottom: 2px solid transparent; border-radius: 0; }
    .subtab-btn.aktif { color: var(--hijau-600); border-bottom-color: var(--hijau-600); }
    .kartu-ringkas { background: var(--panel); border: 1px solid var(--garis); border-radius: var(--radius-kecil); padding: 14px; text-align: center; cursor: pointer; }
    .kartu-ringkas .angka { font-size: 1.5rem; font-weight: 800; color: var(--hijau-700); }
    .bagian-judul { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.06em; color: var(--hijau-700); text-transform: uppercase; margin: 0 0 8px; }
    .baris-info { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--garis-lembut); font-size: 0.8rem; }
    .baris-info span:first-child { color: var(--tinta-lembut); }
    .baris-info span:last-child { font-weight: 700; text-align: right; word-break: break-word; }
    .kartu-ringkas .label { font-size: 0.68rem; color: var(--tinta-lembut); font-weight: 700; }
</style>
</head>
<body>
<div class="bungkus">
    <div class="kop">
        <div class="lambang">S</div>
        <div>
            <div class="nama-sistem" id="txtNamaAplikasi">SPMB<span>Mudacil</span></div>
            <div class="nama-sekolah" id="txtNamaSekolah">Dashboard Sekolah</div>
        </div>
    </div>

    <div id="areaMuat" class="pemuat"><div class="spinner"></div>Memuat dashboard…</div>
    <div id="areaKonten" style="display:none;"></div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
    let sesi = {};
    let cfgPublik = {};
    let viewAktif = "beranda";
    let noPendaftaranDetail = null;
    let detailAktif = null;
    let subTabDetail = "diri";
    let filterPendaftar = { status: "", gelombang: "", cari: "", page: 1 };

    // -----------------------------------------------------------------
    // BOOTSTRAP
    // -----------------------------------------------------------------
    async function mulai() {
        if (!API.sesiInfo().adaToken) { window.location.href = "login.html?panel=sekolah"; return; }

        try {
            // Paralel (bukan berurutan) -> waktu muat awal berkurang separuh.
            const [resVerify, resConfig] = await Promise.all([API.verifyToken(), API.getConfig()]);
            if (!resVerify.ok || (resVerify.data.role !== "petugas" && resVerify.data.role !== "admin")) {
                window.location.href = "login.html?panel=sekolah";
                return;
            }
            sesi = resVerify.data;
            cfgPublik = (resConfig.ok && resConfig.data) ? resConfig.data : {};
            if (cfgPublik.NAMA_APLIKASI) document.getElementById("txtNamaAplikasi").innerHTML = cfgPublik.NAMA_APLIKASI;

            document.getElementById("areaMuat").style.display = "none";
            document.getElementById("areaKonten").style.display = "block";
            render();
        } catch (err) {
            document.getElementById("areaMuat").innerHTML =
                "<div class=\"pesan-error-umum tampil\">Error jaringan: " + UI.escapeHtml(err.message) + "</div>";
        }
    }

    function keluar() {
        const btn = document.getElementById("btnKeluar");
        if (btn) { btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Keluar…"; }
        API.hapusSesiLokal();
        API.logout().catch(function () { /* diamkan, tidak blocking */ });
        window.location.href = "login.html?panel=sekolah";
    }

    function isAdmin() { return sesi.role === "admin"; }

    // -----------------------------------------------------------------
    // RENDER UTAMA (kerangka + tab bar)
    // -----------------------------------------------------------------
    function render() {
        const area = document.getElementById("areaKonten");
        const tabs = [
            ["beranda", "jam", "Beranda"],
            ["pendaftar", "info", "Data Pendaftar"],
            ["pengajuan", "info", "Pengajuan"],
            ["pengumuman", "unggah", "Pengumuman"],
        ];
        if (isAdmin()) tabs.push(["pengaturan", "kunci", "Pengaturan"]);

        area.innerHTML = `
            <div style="padding:16px 16px 0;">
                <div class="hero-gelap" style="padding:14px 16px;">
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <div>
                            <span class="badge amber">${isAdmin() ? "ADMIN" : "PETUGAS"}</span>
                            <div style="font-weight:800; margin-top:6px;">${UI.escapeHtml(sesi.nama || sesi.userId || "-")}</div>
                        </div>
                        <button type="button" class="gelap" id="btnKeluar" style="padding:6px 10px; font-size:0.7rem;">${UI.ikon("keluar")} Keluar</button>
                    </div>
                </div>
            </div>
            <div style="padding:0 16px 16px;">
                <div class="tab-bar" style="grid-template-columns: repeat(${tabs.length}, 1fr);">
                    ${tabs.map(function (t) { return `<button type="button" class="tab-btn" data-tab="${t[0]}">${UI.ikon(t[1])}<span>${t[2]}</span></button>`; }).join("")}
                </div>
                <div id="isiTab"></div>
            </div>
        `;
        document.getElementById("btnKeluar").addEventListener("click", keluar);
        document.querySelectorAll(".tab-btn").forEach(function (btn) {
            btn.classList.toggle("aktif", btn.getAttribute("data-tab") === viewAktif);
            btn.addEventListener("click", function () {
                viewAktif = btn.getAttribute("data-tab");
                noPendaftaranDetail = null;
                render();
            });
        });

        const rute = { beranda: renderBeranda, pendaftar: renderPendaftar, pengajuan: renderPengajuan, pengumuman: renderPengumuman, pengaturan: renderPengaturan, detail: renderDetail };
        (rute[viewAktif] || renderBeranda)();
    }

    function bukaDetail(noPendaftaran) {
        noPendaftaranDetail = noPendaftaran;
        subTabDetail = "diri";
        viewAktif = "detail";
        render();
    }

    // -----------------------------------------------------------------
    // HELPER BERSAMA
    // -----------------------------------------------------------------
    // Label tampilan status. Nilai di database TIDAK diubah (state machine
    // Bagian 4 tetap), hanya cara menampilkannya:
    //   Daftar Ulang -> "Menunggu Daftar Ulang", Selesai -> "Diterima".
    const LABEL_STATUS = { "Daftar Ulang": "Menunggu Daftar Ulang", "Selesai": "Diterima" };
    function labelStatus(s) { return LABEL_STATUS[s] || s || "-"; }
    function warnaStatus(s) {
        if (s === "Perlu Perbaikan") return "amber";
        if (s === "Selesai" || s === "Terverifikasi") return "hijau";
        return "biru";
    }
    function badgeStatus(s) { return `<span class="badge ${warnaStatus(s)}">${UI.escapeHtml(labelStatus(s))}</span>`; }

    /** Modal sederhana. Mengembalikan Promise<{ok, nilai}>; ok=false jika dibatalkan. */
    function modal(opsi) {
        return new Promise(function (resolve) {
            const latar = document.createElement("div");
            latar.className = "modal-latar";
            latar.innerHTML = `
                <div class="modal-kotak">
                    <h3 style="margin:0 0 8px;">${UI.escapeHtml(opsi.judul || "")}</h3>
                    <div class="teks-lembut" style="margin-bottom:10px;">${opsi.isiHtml || ""}</div>
                    ${opsi.input === "teks" ? `<input type="text" id="modalInput" placeholder="${UI.escapeHtml(opsi.placeholder || "")}" autocomplete="off">` : ""}
                    ${opsi.input === "area" ? `<textarea id="modalInput" rows="3" placeholder="${UI.escapeHtml(opsi.placeholder || "")}"></textarea>` : ""}
                    <div class="pesan-error-umum" id="modalError"></div>
                    <div style="display:flex; gap:8px; margin-top:14px;">
                        <button type="button" id="modalBatal" style="flex:1;">Batal</button>
                        <button type="button" class="utama" id="modalOk" style="flex:1;">${UI.escapeHtml(opsi.tombolOk || "OK")}</button>
                    </div>
                </div>`;
            document.body.appendChild(latar);
            const inp = latar.querySelector("#modalInput");
            const btnOk = latar.querySelector("#modalOk");
            if (inp) inp.focus();
            function tutup(hasil) { latar.remove(); resolve(hasil); }
            function cekValid() {
                if (opsi.wajibKata) btnOk.disabled = !inp || inp.value !== opsi.wajibKata;
            }
            if (opsi.wajibKata) { btnOk.disabled = true; if (inp) inp.addEventListener("input", cekValid); }
            latar.querySelector("#modalBatal").addEventListener("click", function () { tutup({ ok: false }); });
            btnOk.addEventListener("click", function () {
                const nilai = inp ? inp.value.trim() : "";
                if (opsi.input && opsi.wajibIsi && !nilai) {
                    const eb = latar.querySelector("#modalError");
                    eb.textContent = opsi.pesanWajib || "Wajib diisi."; eb.classList.add("tampil"); return;
                }
                tutup({ ok: true, nilai: inp ? inp.value : "" });
            });
        });
    }

    // -----------------------------------------------------------------
    // BERANDA = RINGKASAN STATISTIK (Bagian 11/12). Data dari 1 panggilan
    // adminStatistik (cache server 5 menit) — bukan lagi 3 panggilan list.
    // -----------------------------------------------------------------
    function fmtAngka(n) { return Number(n || 0).toLocaleString("id-ID"); }
    function fmtDesimal(n) { return (n === null || n === undefined) ? "-" : Number(n).toFixed(2); }

    function barisNilai(peta) {
        const kunci = Object.keys(peta || {});
        if (!kunci.length) return '<div class="teks-lembut">Belum ada data nilai.</div>';
        return `<div style="overflow-x:auto;"><table class="tabel-data"><thead><tr><th>Mapel</th><th>Jml</th><th>Tertinggi</th><th>Terendah</th><th>Rata-rata</th></tr></thead><tbody>` +
            kunci.map(function (m) {
                const s = peta[m];
                return `<tr style="cursor:default;"><td>${UI.escapeHtml(m)}</td><td>${s.jumlah}</td><td>${fmtDesimal(s.tertinggi)}</td><td>${fmtDesimal(s.terendah)}</td><td><strong>${fmtDesimal(s.rata)}</strong></td></tr>`;
            }).join("") + `</tbody></table></div>`;
    }

    async function renderBeranda(paksaRefresh) {
        const isiTab = document.getElementById("isiTab");
        isiTab.innerHTML = '<div class="pemuat"><div class="spinner"></div>Memuat statistik…</div>';
        try {
            const res = await API.adminStatistik(paksaRefresh === true);
            if (!res.ok) { isiTab.innerHTML = '<div class="pesan-error-umum tampil">' + UI.escapeHtml(res.pesan) + '</div>'; return; }
            const d = res.data;
            const kelasKunci = Object.keys(d.perKelas || {}).sort(function (a, b) { return d.perKelas[b].jumlah - d.perKelas[a].jumlah; });
            const perbaikan = d.perStatus["Perlu Perbaikan"] || 0;
            const menungguVerif = d.perStatus["Menunggu Verifikasi"] || 0;

            isiTab.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 style="margin:0;">Ringkasan</h3>
                    <button type="button" id="btnRefreshStat" style="padding:6px 10px; font-size:0.7rem;">Perbarui</button>
                </div>
                <div class="grid-2">
                    <div class="kartu-ringkas" data-status=""><div class="angka">${fmtAngka(d.totalPendaftar)}</div><div class="label">Total Pendaftar</div></div>
                    <div class="kartu-ringkas" data-status="Selesai"><div class="angka">${fmtAngka(d.diterima)}</div><div class="label">Diterima (Lunas)</div></div>
                </div>
                <div style="height:8px;"></div>
                <div class="grid-2">
                    <div class="kartu-ringkas" data-status="Daftar Ulang"><div class="angka">${fmtAngka(d.menungguDaftarUlang)}</div><div class="label">Menunggu Daftar Ulang</div></div>
                    <div class="kartu-ringkas" data-status=""><div class="angka">${fmtAngka(d.boarding)}</div><div class="label">Boarding</div></div>
                </div>
                <div style="height:8px;"></div>
                <div class="kartu" style="text-align:center;">
                    <div class="teks-kecil">TOTAL UANG MASUK (TERKONFIRMASI)</div>
                    <div class="angka" style="font-size:1.4rem; font-weight:800; color:var(--hijau-700);">${UI.formatRupiah(d.totalUangMasuk)}</div>
                </div>

                <h3 style="margin:16px 0 8px;">Perlu Ditindaklanjuti</h3>
                <div class="grid-2">
                    <div class="kartu-ringkas" data-status="Menunggu Verifikasi"><div class="angka">${fmtAngka(menungguVerif)}</div><div class="label">Menunggu Verifikasi</div></div>
                    <div class="kartu-ringkas" data-status="Perlu Perbaikan"><div class="angka">${fmtAngka(perbaikan)}</div><div class="label">Perlu Perbaikan</div></div>
                </div>
                <div class="teks-kecil" style="margin-top:8px;">${fmtAngka(d.pembayaranMenunggu)} pembayaran menunggu konfirmasi · ${fmtAngka(d.dokumenMenunggu)} dokumen menunggu verifikasi</div>
                ${d.pengajuanMenunggu ? `<div class="catatan amber" style="margin-top:8px; cursor:pointer;" id="kartuPengajuan">${UI.ikon("info")}<span><strong>${fmtAngka(d.pengajuanMenunggu)} pengajuan perubahan data</strong> menunggu ditindaklanjuti — klik untuk buka.</span></div>` : ""}

                <h3 style="margin:16px 0 8px;">Pendaftar per Kelas Peminatan</h3>
                <div class="kartu">
                    ${kelasKunci.length ? `<table class="tabel-data"><thead><tr><th>Kelas</th><th>Pendaftar</th><th>Boarding</th><th>Diterima</th></tr></thead><tbody>
                        ${kelasKunci.map(function (k) { const x = d.perKelas[k]; return `<tr style="cursor:default;"><td>${UI.escapeHtml(k)}</td><td><strong>${x.jumlah}</strong></td><td>${x.boarding}</td><td>${x.lunas}</td></tr>`; }).join("")}
                    </tbody></table>` : '<div class="teks-lembut">Belum ada pendaftar.</div>'}
                </div>

                <h3 style="margin:16px 0 8px;">Asal SD/MI Terbanyak</h3>
                <div class="kartu">
                    ${(d.topAsalSekolah && d.topAsalSekolah.length) ? `<table class="tabel-data"><thead><tr><th>Asal Sekolah</th><th>Jumlah Pendaftar</th></tr></thead><tbody>
                        ${d.topAsalSekolah.map(function (x) { return `<tr style="cursor:default;"><td>${UI.escapeHtml(x.nama)}</td><td><strong>${x.jumlah}</strong></td></tr>`; }).join("")}
                    </tbody></table>` : '<div class="teks-lembut">Belum ada data.</div>'}
                </div>

                <h3 style="margin:16px 0 8px;">Per Gelombang &amp; Jenis Kelamin</h3>
                <div class="kartu">
                    <div class="teks-lembut">${Object.keys(d.perGelombang).map(function (k) { return "Gelombang " + UI.escapeHtml(k) + ": <strong>" + d.perGelombang[k] + "</strong>"; }).join(" · ") || "-"}</div>
                    <div class="teks-lembut" style="margin-top:4px;">${Object.keys(d.perGender).map(function (k) { return UI.escapeHtml(k) + ": <strong>" + d.perGender[k] + "</strong>"; }).join(" · ") || "-"}</div>
                </div>

                <h3 style="margin:16px 0 8px;">Statistik Nilai Rapor</h3>
                <div class="kartu">${barisNilai(d.nilaiRapor.perMapel)}
                    ${d.nilaiRapor.gabungan ? `<div class="ringkasan-nilai"><span>Rata-rata gabungan siswa — Tertinggi: <strong>${fmtDesimal(d.nilaiRapor.gabungan.tertinggi)}</strong></span><span>Terendah: <strong>${fmtDesimal(d.nilaiRapor.gabungan.terendah)}</strong></span><span>Rata-rata: <strong>${fmtDesimal(d.nilaiRapor.gabungan.rata)}</strong></span></div>` : ""}
                </div>
                <h3 style="margin:16px 0 8px;">Statistik Nilai TKA</h3>
                <div class="kartu">${barisNilai(d.nilaiTka.perMapel)}
                    ${d.nilaiTka.gabungan ? `<div class="ringkasan-nilai"><span>Rata-rata gabungan siswa — Tertinggi: <strong>${fmtDesimal(d.nilaiTka.gabungan.tertinggi)}</strong></span><span>Terendah: <strong>${fmtDesimal(d.nilaiTka.gabungan.terendah)}</strong></span><span>Rata-rata: <strong>${fmtDesimal(d.nilaiTka.gabungan.rata)}</strong></span></div>` : ""}
                </div>
                <div class="teks-kecil" style="margin-top:8px;">Diperbarui: ${UI.formatTanggal(d.diperbarui)} (data di-cache maks. 5 menit)</div>
            `;
            document.getElementById("btnRefreshStat").addEventListener("click", function (e) {
                e.currentTarget.disabled = true; e.currentTarget.innerHTML = UI.ikon("spinner") + " Memuat…";
                renderBeranda(true);
            });
            const kartuPengajuan = document.getElementById("kartuPengajuan");
            if (kartuPengajuan) kartuPengajuan.addEventListener("click", function () { viewAktif = "pengajuan"; render(); });
            document.querySelectorAll(".kartu-ringkas").forEach(function (el) {
                el.addEventListener("click", function () {
                    filterPendaftar = { status: el.getAttribute("data-status"), gelombang: "", cari: "", page: 1 };
                    viewAktif = "pendaftar";
                    render();
                });
            });
        } catch (err) {
            isiTab.innerHTML = '<div class="pesan-error-umum tampil">Gagal memuat statistik: ' + UI.escapeHtml(err.message) + '</div>';
        }
    }

    // -----------------------------------------------------------------
    // DATA PENDAFTAR (Bagian 11, list + filter + pagination)
    // -----------------------------------------------------------------
    // -----------------------------------------------------------------
    // DATA PENDAFTAR — cache 1 JAM di sessionStorage (semua baris ringkas,
    // tanpa filter status/cari di server). Cache diperiksa basi-atau-tidak
    // lewat adminLogTerakhir (1 angka, murah) — kalau ada aktivitas baru
    // sejak cache diambil, otomatis ambil ulang. Status & pencarian
    // SEPENUHNYA di-filter di memori browser -> instan, nol round-trip
    // server tiap ganti filter/ketik. Tombol "Perbarui" selalu paksa ambil
    // ulang dari server apa pun kondisinya.
    // -----------------------------------------------------------------
    const CACHE_PENDAFTAR_KEY = "SPMB_CACHE_PENDAFTAR_LIST";
    const CACHE_PENDAFTAR_TTL_MS = 60 * 60 * 1000; // 1 jam
    let semuaPendaftarMemori = null; // array lengkap hasil terakhir di memori

    async function ambilSemuaPendaftar(paksaRefresh) {
        if (!paksaRefresh) {
            try {
                const cache = JSON.parse(sessionStorage.getItem(CACHE_PENDAFTAR_KEY) || "null");
                if (cache && (Date.now() - cache.waktuAmbil) < CACHE_PENDAFTAR_TTL_MS) {
                    const resLog = await API.adminLogTerakhir();
                    if (resLog.ok && resLog.data.timestamp <= cache.waktuLog) {
                        return cache.data; // cache masih valid, tidak ada aktivitas baru
                    }
                }
            } catch (err) { /* cache korup/parse gagal -> lanjut ambil dari server */ }
        }
        const [resList, resLog] = await Promise.all([API.adminGetPendaftar({ semua: "1" }), API.adminLogTerakhir()]);
        if (!resList.ok) throw new Error(resList.pesan);
        const data = resList.data.pendaftar;
        try {
            sessionStorage.setItem(CACHE_PENDAFTAR_KEY, JSON.stringify({ data: data, waktuAmbil: Date.now(), waktuLog: resLog.ok ? resLog.data.timestamp : Date.now() }));
        } catch (err) { /* sessionStorage penuh -> tetap jalan tanpa cache */ }
        return data;
    }

    /** Ekspor CSV dari data yang SUDAH ADA di memori (sama hasil filter status+cari yang sedang tampil) — tanpa panggilan server tambahan. */
    function eksporPendaftarCsv() {
        if (!semuaPendaftarMemori) { UI.toast("Data belum siap, tunggu sebentar.", "error"); return; }
        let rows = semuaPendaftarMemori;
        if (filterPendaftar.status) rows = rows.filter(function (r) { return r.STATUS_PENDAFTARAN === filterPendaftar.status; });
        if (filterPendaftar.cari) {
            const q = filterPendaftar.cari;
            rows = rows.filter(function (r) {
                return String(r.NAMA_LENGKAP).toLowerCase().indexOf(q) !== -1 || String(r.NO_PENDAFTARAN).toLowerCase().indexOf(q) !== -1
                    || String(r.NO_HP).indexOf(q) !== -1 || String(r.ASAL_SEKOLAH || "").toLowerCase().indexOf(q) !== -1;
            });
        }
        if (!rows.length) { UI.toast("Tidak ada data untuk diekspor."); return; }
        const kolom = ["NO_PENDAFTARAN", "NAMA_LENGKAP", "NISN", "JENIS_KELAMIN", "ASAL_SEKOLAH", "NO_HP", "KELAS_PEMINATAN", "BOARDING", "GELOMBANG", "STATUS_PENDAFTARAN"];
        const esc = function (v) { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
        const csv = [kolom.join(",")].concat(rows.map(function (r) { return kolom.map(function (k) { return esc(r[k]); }).join(","); })).join("\r\n");
        const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" }); // \ufeff -> Excel baca UTF-8 dgn benar
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "pendaftar_spmb_" + new Date().toISOString().slice(0, 10) + ".csv";
        a.click();
        URL.revokeObjectURL(a.href);
    }

    async function renderPendaftar() {
        const isiTab = document.getElementById("isiTab");
        const statusList = ["", "Menunggu Verifikasi", "Perlu Perbaikan", "Terverifikasi", "Daftar Ulang", "Selesai"];
        const labelOpsi = function (x) { return x ? labelStatus(x) : "Semua Status"; };

        isiTab.innerHTML = `
            <div class="grup-2kolom">
                <div class="field">
                    <label style="margin-top:0;">Status</label>
                    <select id="fFilterStatus">
                        ${statusList.map(function (s) { return `<option value="${s}" ${filterPendaftar.status === s ? "selected" : ""}>${labelOpsi(s)}</option>`; }).join("")}
                    </select>
                </div>
                <div class="field">
                    <label style="margin-top:0;">Cari (nama/no.reg/HP/asal sekolah)</label>
                    <input type="text" id="fFilterCari" value="${UI.escapeHtml(filterPendaftar.cari)}" placeholder="Ketik untuk cari instan...">
                </div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button type="button" id="btnEksporCsv" style="padding:6px 10px; font-size:0.7rem;">${UI.ikon("unggah")} Ekspor CSV</button>
                <button type="button" id="btnRefreshPendaftar" style="padding:6px 10px; font-size:0.7rem;">${UI.ikon("jam")} Perbarui Data</button>
            </div>
            <div id="daftarPendaftarTabel"><div class="pemuat"><div class="spinner"></div>Memuat data…</div></div>
        `;

        document.getElementById("fFilterStatus").addEventListener("change", function (e) { filterPendaftar.status = e.target.value; filterPendaftar.page = 1; gambarTabelDariMemori(); });
        document.getElementById("fFilterCari").addEventListener("input", function (e) {
            // Tidak ada debounce/timeout server — data sudah di memori, filter instan tiap huruf.
            filterPendaftar.cari = e.target.value.trim().toLowerCase();
            filterPendaftar.page = 1;
            gambarTabelDariMemori();
        });
        document.getElementById("btnEksporCsv").addEventListener("click", eksporPendaftarCsv);
        document.getElementById("btnRefreshPendaftar").addEventListener("click", function (e) {
            const btn = e.currentTarget;
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Memuat…";
            muatTabelPendaftar(true).finally(function () { btn.disabled = false; btn.innerHTML = UI.ikon("jam") + " Perbarui Data"; });
        });

        muatTabelPendaftar(false);
    }

    async function muatTabelPendaftar(paksaRefresh) {
        const wadah = document.getElementById("daftarPendaftarTabel");
        wadah.innerHTML = '<div class="pemuat"><div class="spinner"></div>Memuat data…</div>';
        try {
            semuaPendaftarMemori = await ambilSemuaPendaftar(paksaRefresh);
            gambarTabelDariMemori();
        } catch (err) {
            wadah.innerHTML = '<div class="pesan-error-umum tampil">Error jaringan: ' + UI.escapeHtml(err.message) + '</div>';
        }
    }

    /** Filter + paginasi 20/halaman, murni di memori — dipanggil tiap ganti filter/cari/halaman, tanpa ke server. */
    function gambarTabelDariMemori() {
        const wadah = document.getElementById("daftarPendaftarTabel");
        if (!semuaPendaftarMemori) return;
        let rows = semuaPendaftarMemori;
        if (filterPendaftar.status) rows = rows.filter(function (r) { return r.STATUS_PENDAFTARAN === filterPendaftar.status; });
        if (filterPendaftar.cari) {
            const q = filterPendaftar.cari;
            rows = rows.filter(function (r) {
                return String(r.NAMA_LENGKAP).toLowerCase().indexOf(q) !== -1
                    || String(r.NO_PENDAFTARAN).toLowerCase().indexOf(q) !== -1
                    || String(r.NO_HP).indexOf(q) !== -1
                    || String(r.ASAL_SEKOLAH || "").toLowerCase().indexOf(q) !== -1;
            });
        }
        const total = rows.length;
        const pageSize = 20;
        const totalPages = Math.max(Math.ceil(total / pageSize), 1);
        if (filterPendaftar.page > totalPages) filterPendaftar.page = totalPages;
        const mulai = (filterPendaftar.page - 1) * pageSize;
        const rowsHalaman = rows.slice(mulai, mulai + pageSize);

        if (rowsHalaman.length === 0) {
            wadah.innerHTML = '<div class="kartu teks-lembut" style="text-align:center; margin-top:12px;">Tidak ada data.</div>';
            return;
        }

        wadah.innerHTML = `
            <div style="overflow-x:auto; margin-top:10px;">
                <table class="tabel-data">
                    <thead><tr><th>Nama · NISN</th><th>No. Reg</th><th>Asal Sekolah</th><th>Kelas</th><th>Status</th></tr></thead>
                    <tbody>
                        ${rowsHalaman.map(function (r) {
                            return `<tr data-no="${UI.escapeHtml(r.NO_PENDAFTARAN)}">
                                <td><strong>${UI.escapeHtml(r.NAMA_LENGKAP)}</strong><div class="teks-kecil">${UI.escapeHtml(r.NISN || "-")}</div></td>
                                <td>${UI.escapeHtml(r.NO_PENDAFTARAN)}</td>
                                <td>${UI.escapeHtml(r.ASAL_SEKOLAH || "-")}</td>
                                <td>${UI.escapeHtml(r.KELAS_PEMINATAN || "-")}</td>
                                <td>${badgeStatus(r.STATUS_PENDAFTARAN)}</td>
                            </tr>`;
                        }).join("")}
                    </tbody>
                </table>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <span class="teks-kecil">Halaman ${filterPendaftar.page} dari ${totalPages} (${total} data)</span>
                <div style="display:flex; gap:6px;">
                    <button type="button" id="btnHalPrev" ${filterPendaftar.page <= 1 ? "disabled" : ""} style="padding:7px 10px;">${UI.ikon("panahKiri")}</button>
                    <button type="button" id="btnHalNext" ${filterPendaftar.page >= totalPages ? "disabled" : ""} style="padding:7px 10px;">${UI.ikon("panah")}</button>
                </div>
            </div>
        `;
        wadah.querySelectorAll("tr[data-no]").forEach(function (tr) {
            tr.addEventListener("click", function () { bukaDetail(tr.getAttribute("data-no")); });
        });
        const btnPrev = document.getElementById("btnHalPrev");
        const btnNext = document.getElementById("btnHalNext");
        if (btnPrev) btnPrev.addEventListener("click", function () { filterPendaftar.page--; gambarTabelDariMemori(); });
        if (btnNext) btnNext.addEventListener("click", function () { filterPendaftar.page++; gambarTabelDariMemori(); });
    }

    // -----------------------------------------------------------------
    // DETAIL PENDAFTAR (Bagian 10.1, 10.2, 10.3) — sub-tab Diri/Dokumen/Pembayaran
    // -----------------------------------------------------------------
    // Cache detail 5 menit per No. Pendaftaran. Dipanggil dengan
    // paksaRefresh=true SETIAP KALI ada aksi yang mengubah data orang ini
    // (edit, verifikasi dokumen, konfirmasi bayar, dst) supaya layar tidak
    // pernah menampilkan data basi setelah petugas sendiri mengubahnya.
    const CACHE_DETAIL_TTL_MS = 5 * 60 * 1000;
    async function renderDetail(paksaRefresh) {
        const isiTab = document.getElementById("isiTab");
        isiTab.innerHTML = '<div class="pemuat"><div class="spinner"></div>Memuat detail pendaftar…</div>';

        const kunciCache = "SPMB_CACHE_DETAIL_" + noPendaftaranDetail;
        let detail;
        try {
            if (!paksaRefresh) {
                try {
                    const c = JSON.parse(sessionStorage.getItem(kunciCache) || "null");
                    if (c && (Date.now() - c.waktuAmbil) < CACHE_DETAIL_TTL_MS) detail = c.data;
                } catch (err) { /* abaikan, ambil dari server */ }
            }
            if (!detail) {
                const res = await API.adminGetDetail(noPendaftaranDetail);
                if (!res.ok) { isiTab.innerHTML = '<div class="pesan-error-umum tampil">' + UI.escapeHtml(res.pesan) + '</div>'; return; }
                detail = res.data;
                try { sessionStorage.setItem(kunciCache, JSON.stringify({ data: detail, waktuAmbil: Date.now() })); } catch (err) { /* penuh, abaikan */ }
            }
        } catch (err) {
            isiTab.innerHTML = '<div class="pesan-error-umum tampil">Error jaringan: ' + UI.escapeHtml(err.message) + '</div>';
            return;
        }
        detailAktif = detail;
        const p = detail.pendaftar;
        const templateWA = cfgPublik.WA_TEMPLATE_HUBUNGI_PENDAFTAR || "Assalamu'alaikum bapak/ibu calon wali siswa dari {nama_pendaftar} dengan nomor pendaftaran {no_pendaftaran}.";
        const pesanWA = UI.isiTemplate(templateWA, { nama_pendaftar: p.NAMA_LENGKAP, no_pendaftaran: p.NO_PENDAFTARAN });

        isiTab.innerHTML = `
            <button type="button" class="tombol teks" id="btnKembaliList" style="padding-left:0;">${UI.ikon("panahKiri")} Kembali ke Daftar</button>
            <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap;">
                <div>
                    <h2 style="margin:6px 0 2px;">${UI.escapeHtml(p.NAMA_LENGKAP)}</h2>
                    <div class="teks-lembut">NISN ${UI.escapeHtml(p.NISN || "-")} · ${UI.escapeHtml(p.NO_PENDAFTARAN)}</div>
                    <div class="teks-lembut">${UI.escapeHtml(p.ASAL_SEKOLAH || "-")}</div>
                    <div style="margin-top:6px;">${badgeStatus(p.STATUS_PENDAFTARAN)}</div>
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    ${p.NO_HP ? `<a class="tombol tombol-wa" style="margin-top:6px;" target="_blank" rel="noreferrer" href="${UI.linkWA(p.NO_HP, "", pesanWA)}">${UI.ikon("wa")} Hubungi Pendaftar</a>` : ""}
                    <button type="button" class="tombol" style="margin-top:6px;" id="btnCetakInfo">${UI.ikon("unggah")} Cetak / Unduh PDF</button>
                </div>
            </div>
            <div class="subtab-bar" style="margin-top:14px;">
                <button type="button" class="subtab-btn" data-sub="diri">Data Lengkap</button>
                <button type="button" class="subtab-btn" data-sub="dokumen">Dokumen</button>
                <button type="button" class="subtab-btn" data-sub="pembayaran">Pembayaran</button>
            </div>
            <div id="isiSubDetail"></div>
        `;
        document.getElementById("btnKembaliList").addEventListener("click", function () { viewAktif = "pendaftar"; render(); });
        document.getElementById("btnCetakInfo").addEventListener("click", function () { cetakInfoPendaftar(p); });
        document.querySelectorAll(".subtab-btn").forEach(function (btn) {
            btn.classList.toggle("aktif", btn.getAttribute("data-sub") === subTabDetail);
            btn.addEventListener("click", function () {
                subTabDetail = btn.getAttribute("data-sub");
                document.querySelectorAll(".subtab-btn").forEach(function (b) { b.classList.toggle("aktif", b === btn); });
                renderSubDetail(detail);
            });
        });
        renderSubDetail(detail);
    }

    function renderSubDetail(detail) {
        const wadah = document.getElementById("isiSubDetail");
        if (subTabDetail === "diri") { renderSubDataDiri(detail, wadah); return; }
        if (subTabDetail === "dokumen") { renderSubDokumen(detail, wadah); return; }
        if (subTabDetail === "pembayaran") { renderSubPembayaran(detail, wadah); return; }
    }

        ] },

    function parseNilaiStr(str) {
        const o = {};
        String(str || "").split(",").forEach(function (pair) {
            const kv = pair.split(":");
            if (kv.length === 2 && kv[0].trim()) o[kv[0].trim()] = kv[1].trim();
        });
        return o;
    }

    function inputField(p, f) {
        const [k, label, tipe] = f;
        const v = p[k] == null ? "" : String(p[k]);
        let ctrl;
        if (tipe === "a") ctrl = `<textarea rows="2" data-k="${k}">${UI.escapeHtml(v)}</textarea>`;
        else if (tipe === "jk" || tipe === "yn" || tipe === "yt" || tipe === "kelas") {
            let opsi = tipe === "jk" ? ["Laki-laki", "Perempuan"] : (tipe === "kelas" ? UI.csvKeArray(cfgPublik.KELAS_PEMINATAN_LIST) : ["Ya", "Tidak"]);
            if (v && opsi.indexOf(v) === -1) opsi = [v].concat(opsi);
            ctrl = `<select data-k="${k}"><option value=""></option>${opsi.map(function (o) { return `<option value="${UI.escapeHtml(o)}" ${o === v ? "selected" : ""}>${UI.escapeHtml(o)}</option>`; }).join("")}</select>`;
        } else if (tipe === "gel") {
            ctrl = `<input type="text" data-k="${k}" value="${UI.escapeHtml(v)}" ${isAdmin() ? "" : "disabled"}>`;
        } else ctrl = `<input type="text" data-k="${k}" value="${UI.escapeHtml(v)}">`;
        return `<div class="field"><label style="margin-top:6px; font-size:0.72rem;">${label}</label>${ctrl}</div>`;
    }

    function blokNilai(judul, kolom, mapelConfig, p) {
        const data = parseNilaiStr(p[kolom]);
        const semua = UI.csvKeArray(mapelConfig);
        Object.keys(data).forEach(function (m) { if (semua.indexOf(m) === -1) semua.push(m); });
        return `<div class="bagian-judul" style="margin-top:12px;">${judul}</div>
            <div class="grid-2">${semua.map(function (m) {
                return `<div class="field"><label style="margin-top:4px; font-size:0.72rem;">${UI.escapeHtml(m)}</label><input type="text" inputmode="decimal" data-nilai="${kolom}" data-mapel="${UI.escapeHtml(m)}" value="${UI.escapeHtml(data[m] || "")}"></div>`;
            }).join("")}</div>
            <div class="ringkasan-nilai" data-ringkas="${kolom}" style="display:none;"></div>`;
    }

    // -----------------------------------------------------------------
    // PENGAJUAN PERUBAHAN DATA (dari dashboard pendaftar)
    // -----------------------------------------------------------------
    async function renderPengajuan() {
        const isiTab = document.getElementById("isiTab");
        isiTab.innerHTML = '<div class="pemuat"><div class="spinner"></div>Memuat pengajuan…</div>';
        let rows = [];
        try {
            const res = await API.adminGetPengajuan(false);
            if (!res.ok) { isiTab.innerHTML = '<div class="pesan-error-umum tampil">' + UI.escapeHtml(res.pesan) + '</div>'; return; }
            rows = res.data.pengajuan;
        } catch (err) { isiTab.innerHTML = '<div class="pesan-error-umum tampil">Error jaringan.</div>'; return; }

        isiTab.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="margin:0;">Pengajuan Perubahan Data</h3>
                <a href="#" id="lihatSemuaPengajuan" class="teks-kecil">Lihat yang sudah selesai</a>
            </div>
            <div class="catatan hijau">${UI.ikon("info")}<span>Data TIDAK berubah otomatis — cek permintaan, koreksi manual di tab Data Pendaftar ▸ Data Lengkap, baru tandai selesai di sini.</span></div>
            <div id="daftarPengajuan"></div>
        `;
        document.getElementById("lihatSemuaPengajuan").addEventListener("click", async function (e) {
            e.preventDefault();
            const res = await API.adminGetPengajuan(true);
            if (res.ok) gambarPengajuan(res.data.pengajuan);
        });

        function gambarPengajuan(list) {
            const wadah = document.getElementById("daftarPengajuan");
            if (!list.length) { wadah.innerHTML = '<div class="kartu teks-lembut" style="text-align:center;">Tidak ada pengajuan.</div>'; return; }
            wadah.innerHTML = list.map(function (r) {
                const cls = r.STATUS === "Selesai" ? "hijau" : (r.STATUS === "Ditolak" ? "merah" : "amber");
                return `<div class="kartu">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
                        <div>
                            <div style="font-weight:800; font-size:0.8rem;">${UI.escapeHtml(r.NAMA_PENDAFTAR || "-")}</div>
                            <div class="teks-kecil">${UI.escapeHtml(r.NO_PENDAFTARAN)} · ${UI.formatTanggal(r.TANGGAL)}</div>
                        </div>
                        <span class="badge ${cls}">${UI.escapeHtml(r.STATUS)}</span>
                    </div>
                    <div class="baris-info"><span>Bagian</span><span>${UI.escapeHtml(r.FIELD)}</span></div>
                    <div class="baris-info"><span>Perubahan diminta</span><span>${UI.escapeHtml(r.PERUBAHAN)}</span></div>
                    ${r.CATATAN ? `<div class="teks-kecil" style="margin-top:6px;">Catatan: ${UI.escapeHtml(r.CATATAN)}</div>` : ""}
                    ${r.STATUS === "Menunggu" ? `
                        <div style="display:flex; gap:8px; margin-top:10px;">
                            <button type="button" class="utama" data-buka-pendaftar="${UI.escapeHtml(r.NO_PENDAFTARAN)}" style="flex:1;">Buka Data Pendaftar</button>
                            <button type="button" data-selesai="${r.PENGAJUAN_ID}" style="flex:1;">Tandai Selesai</button>
                        </div>` : ""}
                </div>`;
            }).join("");

            wadah.querySelectorAll("[data-buka-pendaftar]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    noPendaftaranDetail = btn.getAttribute("data-buka-pendaftar");
                    viewAktif = "detail"; subTabDetail = "diri"; render();
                });
            });
            wadah.querySelectorAll("[data-selesai]").forEach(function (btn) {
                btn.addEventListener("click", async function () {
                    btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Memproses…";
                    try {
                        const res = await API.adminSelesaikanPengajuan(btn.getAttribute("data-selesai"), "Selesai");
                        if (!res.ok) throw new Error(res.pesan);
                        UI.toast("Pengajuan ditandai selesai.");
                        renderPengajuan();
                    } catch (err) { UI.toast(err.message || "Gagal.", "error"); btn.disabled = false; btn.textContent = "Tandai Selesai"; }
                });
            });
        }
        gambarPengajuan(rows);
    }

    /** "Cetak / Unduh PDF" info pendaftar lengkap — dipakai dari Detail Pendaftar. */
    function cetakInfoPendaftar(p) {
        function statNilai(str) {
            const vals = String(str || "").split(",").map(function (pair) { return parseFloat((pair.split(":")[1] || "").trim().replace(",", ".")); }).filter(function (v) { return !isNaN(v); });
            if (!vals.length) return "-";
            const tot = vals.reduce(function (a, b) { return a + b; }, 0);
            return vals.length + " nilai, total " + tot.toFixed(2) + ", rata-rata " + (tot / vals.length).toFixed(2);
        }
        const baris = [
            ["Nama Lengkap", p.NAMA_LENGKAP], ["NISN", p.NISN], ["Tempat, Tanggal Lahir", p.TEMPAT_TGL_LAHIR],
            ["Asal Sekolah", p.ASAL_SEKOLAH], ["No. Pendaftaran", p.NO_PENDAFTARAN], ["Status", labelStatus(p.STATUS_PENDAFTARAN)],
            ["Kelas Peminatan", p.KELAS_PEMINATAN], ["Program", p.BOARDING === "Ya" ? "Boarding" : "Non-Boarding"], ["Gelombang", p.GELOMBANG],
            ["Nilai Rapor", statNilai(p.NILAI_MAPEL_RAPOR)], ["Nilai TKA", statNilai(p.NILAI_MAPEL_TKA)],
            ["No. HP", p.NO_HP], ["Alamat", p.ALAMAT],
        ];
        UI.cetakHalaman("Info Pendaftar - " + p.NAMA_LENGKAP, `
            <h1>${UI.escapeHtml(p.NAMA_LENGKAP)}</h1>
            <div class="sub">${UI.escapeHtml(cfgPublik.NAMA_SEKOLAH || "")} — SPMB ${UI.escapeHtml(cfgPublik.TAHUN_AJARAN || "")}</div>
            <table>${baris.map(function (b) { return `<tr><td>${UI.escapeHtml(b[0])}</td><td>${UI.escapeHtml(b[1] == null || b[1] === "" ? "-" : String(b[1]))}</td></tr>`; }).join("")}</table>
        `);
    }

        // total & rata-rata otomatis per kolom nilai (2 desimal)
        function hitungNilai(kolom) {
            const box = wadah.querySelector('[data-ringkas="' + kolom + '"]');
            const vals = [];
            wadah.querySelectorAll('[data-nilai="' + kolom + '"]').forEach(function (el) {
                const v = parseFloat(el.value.replace(",", "."));
                if (!isNaN(v)) vals.push(v);
            });
            if (!vals.length) { box.style.display = "none"; return; }
            const tot = vals.reduce(function (a, b) { return a + b; }, 0);
            box.style.display = "flex";
            box.innerHTML = `<span>Total: <strong>${tot.toFixed(2)}</strong></span><span>Rata-rata: <strong>${(tot / vals.length).toFixed(2)}</strong></span><span>${vals.length} nilai</span>`;
        }
        ["NILAI_MAPEL_RAPOR", "NILAI_MAPEL_TKA"].forEach(function (kol) {
            hitungNilai(kol);
            wadah.querySelectorAll('[data-nilai="' + kol + '"]').forEach(function (el) { el.addEventListener("input", function () { hitungNilai(kol); }); });
        });

        document.getElementById("btnSimpanDiri").addEventListener("click", async function () {
            const errorBox = document.getElementById("errorEditDiri");
            errorBox.classList.remove("tampil");
            const payload = { noPendaftaran: p.NO_PENDAFTARAN };
            wadah.querySelectorAll("[data-k]").forEach(function (el) {
                if (el.disabled) return;
                const k = el.getAttribute("data-k");
                if (String(el.value).trim() !== String(p[k] == null ? "" : p[k]).trim()) payload[k] = el.value.trim();
            });
            ["NILAI_MAPEL_RAPOR", "NILAI_MAPEL_TKA"].forEach(function (kol) {
                const pasangan = [];
                let salah = false;
                wadah.querySelectorAll('[data-nilai="' + kol + '"]').forEach(function (el) {
                    const v = el.value.trim().replace(",", ".");
                    if (!v) return;
                    if (isNaN(parseFloat(v)) || parseFloat(v) < 0 || parseFloat(v) > 100) salah = true;
                    pasangan.push(el.getAttribute("data-mapel") + ":" + v);
                });
                if (salah) { errorBox.textContent = "Nilai harus angka 0-100 (pakai titik untuk desimal)."; errorBox.classList.add("tampil"); payload.__salah = true; return; }
                const baru = pasangan.join(",");
                if (baru !== String(p[kol] || "")) payload[kol] = baru;
            });
            if (payload.__salah) return;
            if (payload.KELAS_PEMINATAN !== undefined) {
                payload.alasanPindahKelas = document.getElementById("fAlasanPindah").value.trim();
                if (!payload.alasanPindahKelas) { errorBox.textContent = "Alasan pindah kelas wajib diisi."; errorBox.classList.add("tampil"); return; }
            }
            if (Object.keys(payload).length === 1) { UI.toast("Tidak ada perubahan untuk disimpan."); return; }

            const btn = document.getElementById("btnSimpanDiri");
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Menyimpan…";
            try {
                const res = await API.updateProfile(payload);
                if (!res.ok) throw new Error(res.pesan);
                UI.toast("Data pendaftar berhasil diperbarui.");
                renderDetail(true);
            } catch (err) {
                errorBox.textContent = err.message || "Gagal menyimpan.";
                errorBox.classList.add("tampil");
                btn.disabled = false; btn.textContent = "Simpan Perubahan";
            }
        });

        document.getElementById("btnResetPin").addEventListener("click", async function () {
            const pinBaru = document.getElementById("fPinBaru").value.trim();
            if (!/^\d{6}$/.test(pinBaru)) { UI.toast("PIN baru harus 6 digit angka.", "error"); return; }
            const btn = document.getElementById("btnResetPin");
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Reset…";
            try {
                const res = await API.adminResetPIN(p.NO_PENDAFTARAN, pinBaru);
                if (!res.ok) throw new Error(res.pesan);
                document.getElementById("fPinBaru").value = "";
                await modal({
                    judul: "PIN Berhasil Direset",
                    isiHtml: `No. Pendaftaran <strong>${UI.escapeHtml(p.NO_PENDAFTARAN)}</strong> — ${UI.escapeHtml(p.NAMA_LENGKAP)}<br><br>PIN baru: <strong style="font-size:1.3rem; letter-spacing:0.2em;">${UI.escapeHtml(pinBaru)}</strong><br><br>Sampaikan PIN ini ke pendaftar secara aman — tidak akan ditampilkan lagi setelah ini ditutup.`,
                    tombolOk: "Sudah Dicatat",
                });
            } catch (err) { UI.toast(err.message || "Gagal reset PIN.", "error"); }
            btn.disabled = false; btn.textContent = "Reset";
        });
    }

    /** Pasang aksi "buka file via server" pada semua tombol [data-buka] di dalam wadah. */
    function pasangTombolBuka(wadah, setelahBerhasil) {
        wadah.querySelectorAll("[data-buka]").forEach(function (tombol) {
            tombol.addEventListener("click", async function () {
                const teksAsal = tombol.innerHTML;
                tombol.disabled = true; tombol.innerHTML = UI.ikon("spinner") + " Membuka…";
                const ok = await UI.bukaFile(tombol.getAttribute("data-buka"), tombol.getAttribute("data-id"));
                tombol.disabled = false; tombol.innerHTML = teksAsal;
                if (ok && setelahBerhasil) setelahBerhasil(tombol);
            });
        });
    }

    function renderSubDokumen(detail, wadah) {
        const p = detail.pendaftar;
        const jenisWajib = UI.csvKeArray(cfgPublik.JENIS_DOKUMEN_LIST);
        const jenisOpsional = UI.csvKeArray(cfgPublik.JENIS_DOKUMEN_OPSIONAL || "BUKTI_PRESTASI");
        const daftarJenis = jenisWajib.map(function (j) { return [j, false]; })
            .concat(jenisOpsional.filter(function (j) {
                return (p.PRESTASI && String(p.PRESTASI).trim()) || detail.dokumen.some(function (d) { return d.JENIS_DOKUMEN === j; });
            }).map(function (j) { return [j, true]; }));

        wadah.innerHTML = `<div class="catatan hijau">${UI.ikon("info")}<span>Dokumen bertanda <em>opsional</em> tidak memengaruhi status pendaftar. Status Diterima ditentukan oleh pembayaran.</span></div>` +
            daftarJenis.map(function (item) {
                const jenis = item[0], opsional = item[1];
                const row = detail.dokumen.find(function (d) { return d.JENIS_DOKUMEN === jenis; });
                const judul = `${UI.escapeHtml(jenis)}${opsional ? ' <span class="opsional">(opsional)</span>' : ""}`;
                if (!row || !row.FILE_URL) {
                    return `<div class="baris-dokumen"><div class="nama">${judul}</div><span class="badge abu">Belum Upload</span></div>`;
                }
                return `
                <div class="kartu">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="nama" style="font-weight:800; font-size:0.8rem;">${judul}</span>
                        <span class="badge ${row.STATUS === "Valid" ? "hijau" : (row.STATUS === "Perlu Perbaikan" ? "amber" : "biru")}">${UI.escapeHtml(row.STATUS)}</span>
                    </div>
                    <button type="button" class="tombol teks" data-buka="dokumen" data-id="${UI.escapeHtml(row.DOKUMEN_ID)}" style="padding-left:0;">Lihat berkas ${UI.ikon("panah")}</button>
                    ${row.CATATAN_PETUGAS ? `<div class="catatan-petugas">"${UI.escapeHtml(row.CATATAN_PETUGAS)}"</div>` : ""}
                    ${row.STATUS !== "Valid" ? `
                        <div style="display:flex; gap:8px; margin-top:10px;">
                            <button type="button" class="utama" data-verif="${row.DOKUMEN_ID}" data-status="Valid" style="flex:1;">Tandai Valid</button>
                            <button type="button" data-verif="${row.DOKUMEN_ID}" data-status="Perlu Perbaikan" style="flex:1;">Perlu Perbaikan</button>
                        </div>` : ""}
                </div>`;
            }).join("");

        pasangTombolBuka(wadah);

        wadah.querySelectorAll("[data-verif]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
                const dokumenId = btn.getAttribute("data-verif");
                const statusBaru = btn.getAttribute("data-status");
                let catatan = "";
                if (statusBaru === "Perlu Perbaikan") {
                    const m = await modal({ judul: "Perlu Perbaikan", isiHtml: "Tulis catatan untuk pendaftar (apa yang harus diperbaiki).", input: "area", wajibIsi: true, pesanWajib: "Catatan wajib diisi.", tombolOk: "Kirim" });
                    if (!m.ok) return;
                    catatan = m.nilai.trim();
                }
                btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Memproses…";
                try {
                    const res = await API.adminVerifikasiDokumen(dokumenId, statusBaru, catatan);
                    if (!res.ok) throw new Error(res.pesan);
                    UI.toast("Status dokumen diperbarui.");
                    renderDetail(true);
                } catch (err) { UI.toast(err.message || "Gagal memperbarui status.", "error"); btn.disabled = false; btn.textContent = statusBaru === "Valid" ? "Tandai Valid" : "Perlu Perbaikan"; }
            });
        });
    }

                <div class="baris-info"><span>Potongan${rb.keteranganPotongan ? " — " + UI.escapeHtml(rb.keteranganPotongan) : ""}</span><span>${rb.potongan ? "- " + UI.formatRupiah(rb.potongan) : "-"}</span></div>

            </div>

            <div class="kartu">
                <div class="bagian-judul">Potongan Biaya</div>
                <p class="teks-lembut" style="margin:0 0 8px;">Isi nominal POSITIF (mis. 300000). Isi 0 untuk menghapus potongan. Untuk gratis penuh isi sebesar biaya pendaftaran.</p>
                <div class="grid-2">
                    <div class="field"><label style="margin-top:0; font-size:0.72rem;">Nominal Potongan</label><input type="text" inputmode="numeric" id="fPotongan" value="${rb.potongan || ""}"></div>
                    <div class="field"><label style="margin-top:0; font-size:0.72rem;">Keterangan</label><input type="text" id="fKetPotongan" value="${UI.escapeHtml(rb.keteranganPotongan || "")}" placeholder="Beasiswa / Anak Guru / Anak Panti / Gel. 1"></div>
                </div>
                <div class="pesan-error-umum" id="errorPotongan"></div>
                <button type="button" class="blok" id="btnSimpanPotongan" style="margin-top:8px;">Simpan Potongan</button>
            </div>

            <div class="kartu">
                <div class="bagian-judul">Catat Pembayaran Langsung</div>
                <div class="grid-2">
                    <div class="field"><label style="margin-top:0; font-size:0.72rem;">Jenis</label><select id="fJenisBayar"><option>DP</option><option>Daftar Ulang</option></select></div>
                    <div class="field"><label style="margin-top:0; font-size:0.72rem;">Metode</label><select id="fMetodeBayar"><option>Tunai</option><option>Transfer</option></select></div>
                </div>
                <div class="field"><label style="margin-top:6px; font-size:0.72rem;">Nominal</label><input type="text" inputmode="numeric" id="fNominalBayar" placeholder="mis. 100000"></div>
                <div class="pesan-error-umum" id="errorCatatBayar"></div>
                <button type="button" class="utama blok" id="btnCatatBayar" style="margin-top:8px;">Catat &amp; Konfirmasi</button>
            </div>

            <div class="bagian-judul" style="margin-top:14px;">Riwayat Pembayaran</div>

        document.getElementById("btnSimpanPotongan").addEventListener("click", async function (e) {
            const btn = e.currentTarget, eb = document.getElementById("errorPotongan");

            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Menyimpan…";
            try {
                const res = await API.adminSetPotongan(p.NO_PENDAFTARAN, document.getElementById("fPotongan").value, document.getElementById("fKetPotongan").value);

                UI.toast("Potongan disimpan.");
                renderDetail(true);
            } catch (err) { eb.textContent = err.message || "Gagal."; eb.classList.add("tampil"); btn.disabled = false; btn.textContent = "Simpan Potongan"; }
        });

        document.getElementById("btnCatatBayar").addEventListener("click", async function (e) {
            const btn = e.currentTarget, eb = document.getElementById("errorCatatBayar");
            eb.classList.remove("tampil");
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Mencatat…";
            try {
                const res = await API.adminInputPembayaran(p.NO_PENDAFTARAN, document.getElementById("fJenisBayar").value, document.getElementById("fMetodeBayar").value, document.getElementById("fNominalBayar").value);
                if (!res.ok) throw new Error(res.pesan);
                UI.toast("Pembayaran tercatat & terkonfirmasi.");
                renderDetail(true);
            } catch (err) { eb.textContent = err.message || "Gagal."; eb.classList.add("tampil"); btn.disabled = false; btn.textContent = "Catat & Konfirmasi"; }
        });

        const daftar = document.getElementById("daftarBayar");
        if (detail.pembayaran.length === 0) {
            daftar.innerHTML = '<div class="kartu teks-lembut" style="text-align:center;">Belum ada pembayaran tercatat.</div>';
            return;
        }
        daftar.innerHTML = detail.pembayaran.map(function (b) {
            const menunggu = b.STATUS_KONFIRMASI === "Menunggu";
            const perluBukti = String(b.METODE) !== "Tunai";
            const adaBukti = !!b.BUKTI_URL;
            return `
            <div class="kartu" data-bayar-kartu="${b.PAYMENT_ID}" data-perlu-bukti="${perluBukti && adaBukti ? "1" : "0"}">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:800; font-size:0.8rem;">${UI.escapeHtml(b.JENIS)} · ${UI.escapeHtml(b.METODE)}</span>
                    <span style="font-weight:800; color:var(--hijau-700);">${UI.formatRupiah(b.NOMINAL)}</span>
                </div>
                <div class="teks-kecil">${UI.formatTanggal(b.TANGGAL)}</div>

                <span class="badge ${b.STATUS_KONFIRMASI === "Dikonfirmasi" ? "hijau" : (b.STATUS_KONFIRMASI === "Ditolak" ? "merah" : "amber")}" style="display:inline-block; margin-top:4px;">${UI.escapeHtml(b.STATUS_KONFIRMASI)}</span>
                ${menunggu ? `
                    <div class="field"><label style="margin-top:8px; font-size:0.72rem;">Nominal (koreksi jika salah ketik)</label><input type="text" inputmode="numeric" data-nominal value="${UI.escapeHtml(String(b.NOMINAL || "").replace(/\D/g, ""))}"></div>
                    ${perluBukti && adaBukti ? '<div class="teks-kecil" data-hint-bukti style="margin-top:6px;">Buka bukti dulu sebelum mengonfirmasi.</div>' : ""}
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <button type="button" class="utama" data-konfirmasi="${b.PAYMENT_ID}" style="flex:1;" ${(perluBukti && !adaBukti) || (perluBukti && adaBukti) ? "disabled" : ""}>Konfirmasi</button>
                        <button type="button" data-tolak="${b.PAYMENT_ID}" style="flex:1;">Tolak</button>
                    </div>` : ""}
            </div>`;
        }).join("");

        // Tombol Konfirmasi baru aktif setelah bukti BENAR-BENAR berhasil dibuka
        pasangTombolBuka(daftar, function (tombol) {
            if (!tombol.hasAttribute("data-lihat-bukti")) return;
            const kartu = tombol.closest("[data-bayar-kartu]");
            const btn = kartu.querySelector("[data-konfirmasi]");
            if (btn) btn.disabled = false;
            const hint = kartu.querySelector("[data-hint-bukti]");
            if (hint) hint.textContent = "Bukti sudah dibuka — silakan konfirmasi jika sesuai.";
        });

        daftar.querySelectorAll("[data-konfirmasi]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
                const kartu = btn.closest("[data-bayar-kartu]");
                const nominal = kartu.querySelector("[data-nominal]").value;
                btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Memproses…";
                try {
                    const res = await API.adminKonfirmasiPembayaran(btn.getAttribute("data-konfirmasi"), "Dikonfirmasi", "", nominal);
                    if (!res.ok) throw new Error(res.pesan);
                    UI.toast("Pembayaran dikonfirmasi.");
                    renderDetail(true);
                } catch (err) { UI.toast(err.message || "Gagal.", "error"); btn.disabled = false; btn.textContent = "Konfirmasi"; }
            });
        });
        daftar.querySelectorAll("[data-tolak]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
                const m = await modal({ judul: "Tolak Pembayaran", isiHtml: "Tulis alasan penolakan.", input: "area", wajibIsi: true, pesanWajib: "Alasan wajib diisi.", tombolOk: "Tolak" });
                if (!m.ok) return;
                btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Memproses…";
                try {
                    const res = await API.adminKonfirmasiPembayaran(btn.getAttribute("data-tolak"), "Ditolak", m.nilai.trim());
                    if (!res.ok) throw new Error(res.pesan);
                    UI.toast("Pembayaran ditolak.");
                    renderDetail(true);
                } catch (err) { UI.toast(err.message || "Gagal.", "error"); btn.disabled = false; btn.textContent = "Tolak"; }
            });
        });
    }

    async function renderPengumuman() {
        const isiTab = document.getElementById("isiTab");
        isiTab.innerHTML = '<div class="pemuat"><div class="spinner"></div>Memuat pengumuman…</div>';
        try {
            const res = await API.getPengumuman();
            const rows = (res.ok && res.data && res.data.pengumuman) ? res.data.pengumuman : [];

            isiTab.innerHTML = `
                <button type="button" class="utama blok" id="btnBuatPengumuman">Buat Pengumuman Baru</button>
                <div id="formPengumuman" style="display:none; margin-top:12px;"></div>
                <h3 style="margin-top:18px;">Pengumuman Aktif</h3>
                <div class="catatan amber">${UI.ikon("info")}<span>Daftar ini hanya menampilkan pengumuman yang sedang aktif (backend belum punya endpoint untuk melihat yang nonaktif).</span></div>
                ${rows.length === 0 ? '<div class="kartu teks-lembut" style="text-align:center;">Belum ada pengumuman aktif.</div>' :
                    rows.map(function (r) {
                        return `<div class="kartu" data-id="${UI.escapeHtml(r.PENGUMUMAN_ID)}" data-judul="${UI.escapeHtml(r.JUDUL)}" data-isi="${UI.escapeHtml(r.ISI || "")}" data-link-wa="${UI.escapeHtml(r.LINK_WA || "")}">
                            <div style="font-weight:800;">${UI.escapeHtml(r.JUDUL)}</div>
                            <p class="teks-lembut" style="margin:4px 0;">${UI.escapeHtml(r.ISI || "")}</p>
                            ${r.LINK_WA ? `<a href="${UI.escapeHtml(r.LINK_WA)}" target="_blank" rel="noreferrer" class="tombol teks" style="padding-left:0;">${UI.ikon("wa")} Link WA terlampir</a>` : ""}
                            <div style="display:flex; gap:8px; margin-top:8px;">
                                <button type="button" class="tombol teks" data-aksi-edit style="padding-left:0;">Edit</button>
                                <button type="button" class="tombol teks" data-aksi-nonaktif style="padding-left:0; color:var(--merah);">Nonaktifkan</button>
                            </div>
                        </div>`;
                    }).join("")}
            `;

            document.getElementById("btnBuatPengumuman").addEventListener("click", function () { bukaFormPengumuman(null, "", ""); });
            wadahEventPengumuman();
        } catch (err) {
            isiTab.innerHTML = '<div class="pesan-error-umum tampil">Error jaringan: ' + UI.escapeHtml(err.message) + '</div>';
        }
    }

    function wadahEventPengumuman() {
        document.querySelectorAll("[data-aksi-edit]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                const kartu = btn.closest("[data-id]");
                bukaFormPengumuman(kartu.getAttribute("data-id"), kartu.getAttribute("data-judul"), kartu.getAttribute("data-isi"), kartu.getAttribute("data-link-wa"));
            });
        });
        document.querySelectorAll("[data-aksi-nonaktif]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
                const kartu = btn.closest("[data-id]");
                if (!confirm("Nonaktifkan pengumuman ini?")) return;
                try {
                    const res = await API.adminSimpanPengumuman(kartu.getAttribute("data-id"), kartu.getAttribute("data-judul"), kartu.getAttribute("data-isi"), "Tidak", kartu.getAttribute("data-link-wa"));
                    if (!res.ok) throw new Error(res.pesan);
                    UI.toast("Pengumuman dinonaktifkan.");
                    renderPengumuman();
                } catch (err) { UI.toast(err.message || "Gagal.", "error"); }
            });
        });
    }

    function bukaFormPengumuman(id, judul, isi, linkWa) {

        wadah.style.display = "block";
        wadah.innerHTML = `
            <div class="kartu">
                <label style="margin-top:0;">Judul</label>

                <textarea id="fIsiPengumuman" rows="3">${UI.escapeHtml(isi)}</textarea>
                <label>Link WhatsApp <span class="opsional">(opsional — buat dulu di wa.me, contoh: https://wa.me/6281xxxx?text=Assalamu%27alaikum...)</span></label>
                <input type="text" id="fLinkWaPengumuman" value="${UI.escapeHtml(linkWa || "")}" placeholder="https://wa.me/6281...">
                <div class="pesan-error-umum" id="errorPengumuman"></div>

        document.getElementById("btnSimpanPengumuman").addEventListener("click", async function () {
            const j = document.getElementById("fJudulPengumuman").value.trim();
            const i = document.getElementById("fIsiPengumuman").value.trim();
            const lw = document.getElementById("fLinkWaPengumuman").value.trim();
            const errorBox = document.getElementById("errorPengumuman");
            errorBox.classList.remove("tampil");
            if (!j) { errorBox.textContent = "Judul wajib diisi."; errorBox.classList.add("tampil"); return; }
            if (lw && lw.indexOf("https://wa.me/") !== 0) { errorBox.textContent = "Link WA harus diawali https://wa.me/"; errorBox.classList.add("tampil"); return; }
            const btn = document.getElementById("btnSimpanPengumuman");
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Menyimpan…";
            try {
                const res = await API.adminSimpanPengumuman(id, j, i, "Ya", lw);
                if (!res.ok) throw new Error(res.pesan);
                UI.toast("Pengumuman tersimpan.");
                renderPengumuman();
            } catch (err) {
                errorBox.textContent = err.message || "Gagal menyimpan.";
                errorBox.classList.add("tampil");
                btn.disabled = false; btn.textContent = "Simpan";
            }
        });
    }

    // -----------------------------------------------------------------
    // PENGATURAN (admin saja) — editor CONFIG satu-per-satu (Bagian 12)
    // -----------------------------------------------------------------
    function renderPengaturan() {
        if (!isAdmin()) { viewAktif = "beranda"; render(); return; }
        const isiTab = document.getElementById("isiTab");
        const keyUmum = [
            "STATUS_PENDAFTARAN_DIBUKA", "TAHUN_AJARAN", "TAHUN_AJARAN_PENDEK",
            "BIAYA_PENDAFTARAN_L", "BIAYA_PENDAFTARAN_P", "BIAYA_DP_MIN", "KELAS_PEMINATAN_LIST",
            "WA_TEMPLATE_HUBUNGI_PENDAFTAR", "JENIS_DOKUMEN_OPSIONAL", "REKENING_1", "REKENING_2",
            "ADMIN_WA_1_NAMA", "ADMIN_WA_1_NOMOR", "ADMIN_WA_2_NAMA", "ADMIN_WA_2_NOMOR",
            "FORM_TUTUP_JUDUL", "FORM_TUTUP_SUBJUDUL", "FORM_TUTUP_INFO_TAMBAHAN",
            "FITUR_SURVEI_AKTIF",
        ];
        const keteranganKey = {
            STATUS_PENDAFTARAN_DIBUKA: 'Isi persis salah satu: Ya / Offline / Tidak. "Ya" = semua bisa daftar & login. "Offline" = pendaftar baru ditolak, pendaftar lama & petugas/admin tetap bisa. "Tidak" = cuma admin yang bisa login.',
            TAHUN_AJARAN: 'Teks bebas untuk ditampilkan ke pendaftar, contoh: 2026/2027.',
            TAHUN_AJARAN_PENDEK: '4 digit, dipakai di depan No. Pendaftaran, contoh: 2627.',
            BIAYA_PENDAFTARAN_L: 'Angka saja tanpa titik/Rp, contoh: 1750000. Biaya pendaftaran untuk JENIS_KELAMIN diawali "Laki".',
            BIAYA_PENDAFTARAN_P: 'Angka saja tanpa titik/Rp, contoh: 1800000. Biaya pendaftaran untuk JENIS_KELAMIN diawali "Perempuan".',
            BIAYA_DP_MIN: 'Angka saja, contoh: 100000. Minimal DP yang disarankan (tidak memblokir submit kalau kurang).',
            KELAS_PEMINATAN_LIST: 'Daftar kelas dipisah koma, TANPA spasi setelah koma, contoh: Reguler,Tahfidz,Unggulan.',
            WA_TEMPLATE_HUBUNGI_PENDAFTAR: 'Teks pesan WA ke pendaftar. Boleh pakai {nama_pendaftar} dan {no_pendaftaran}, otomatis diganti.',
            JENIS_DOKUMEN_OPSIONAL: 'Daftar jenis dokumen TAMBAHAN dipisah koma (selain yang wajib), contoh: BUKTI_PRESTASI.',
            REKENING_1: 'Teks bebas nomor rekening tujuan DP, contoh: BSI 7123456789 a.n. SMP Muhammadiyah 2 Cilacap. Kosongkan kalau belum ada.',
            REKENING_2: 'Rekening alternatif kedua (opsional), format sama seperti REKENING_1.',
            ADMIN_WA_1_NAMA: 'Nama admin yang tampil di tombol WA, contoh: Admin SPMB.',
            ADMIN_WA_1_NOMOR: 'WAJIB format 628xxxxxxxxxx (awali 62, BUKAN 0) — kalau diawali 0 tombol WA tidak akan berfungsi.',
            ADMIN_WA_2_NAMA: 'Sama seperti ADMIN_WA_1_NAMA, untuk admin kedua (opsional).',
            ADMIN_WA_2_NOMOR: 'Sama seperti ADMIN_WA_1_NOMOR, format 628xxxxxxxxxx.',
            FORM_TUTUP_JUDUL: 'Judul besar di halaman form_tutup.html saat pendaftaran ditutup.',
            FORM_TUTUP_SUBJUDUL: 'Sub-judul/penjelasan singkat di halaman form_tutup.html.',
            FORM_TUTUP_INFO_TAMBAHAN: 'Info tambahan opsional di halaman form_tutup.html, mis. kapan dibuka lagi.',
            FITUR_SURVEI_AKTIF: 'Isi persis: Ya atau Tidak. Mengaktif/nonaktifkan kartu survei di halaman sukses.',
        };
        isiTab.innerHTML = `
            <div class="kartu">
                <div class="bagian-judul">Cara Menambah Akun Petugas/Admin</div>
                <p class="teks-lembut" style="margin:0 0 6px;">Buka sheet <strong>USERS</strong> di Spreadsheet langsung (belum ada menu Kelola User di dashboard ini), isi 1 baris per orang:</p>
                <div class="baris-info"><span>USER_ID</span><span>Bebas, unik, mis. inisial</span></div>
                <div class="baris-info"><span>NAMA</span><span>Nama lengkap</span></div>
                <div class="baris-info"><span>EMAIL</span><span>Wajib unik, dipakai login</span></div>
                <div class="baris-info"><span>PASSWORD</span><span>Bebas (tersimpan apa adanya, TIDAK di-hash)</span></div>
                <div class="baris-info"><span>PIN</span><span>6 digit angka</span></div>
                <div class="baris-info"><span>ROLE</span><span>HARUS persis huruf kecil: admin / petugas</span></div>
                <div class="baris-info"><span>STATUS_AKTIF</span><span>HARUS persis: Ya</span></div>
                <p class="teks-lembut" style="margin:8px 0 0;">Kesalahan paling umum: ROLE ditulis "Admin"/"Petugas" (huruf besar) atau STATUS_AKTIF bukan "Ya" persis — login akan selalu gagal meski data lain benar.</p>
            </div>
            <div class="catatan amber">${UI.ikon("info")}<span>Hanya key CONFIG umum yang ditampilkan di sini. Key rahasia (SELF_CHECK_KEY, DRIVE_*_FOLDER_ID) sengaja tidak bisa diedit lewat dashboard — ubah langsung dari Google Sheet CONFIG kalau perlu.</span></div>
            <div class="kartu">
                <label style="margin-top:0;">Pilih Key CONFIG</label>
                <select id="fPilihKey">${keyUmum.map(function (k) { return `<option value="${k}">${k}</option>`; }).join("")}</select>
                <div class="teks-kecil" id="keteranganKey" style="margin-top:6px; color:var(--tinta-lembut);"></div>
                <label>Nilai Saat Ini</label>
                <input type="text" id="fNilaiSekarang" disabled>
                <label>Nilai Baru</label>
                <input type="text" id="fNilaiBaru">
                <div class="pesan-error-umum" id="errorConfig"></div>
                <button type="button" class="utama blok" id="btnSimpanConfig" style="margin-top:10px;">Simpan Perubahan</button>
            </div>
            <div class="kartu">
                <div class="bagian-judul">Bersihkan Riwayat Aktivitas</div>
                <p class="teks-lembut" style="margin:0 0 10px;">Hapus log lama agar Spreadsheet tidak membengkak. Log yang lebih baru tetap disimpan. Tindakan ini tidak bisa dibatalkan.</p>
                <div style="display:grid; gap:8px;">
                    <button type="button" data-hari="60">Hapus log lebih dari 60 hari</button>
                    <button type="button" data-hari="90">Hapus log lebih dari 90 hari</button>
                    <button type="button" data-hari="180">Hapus log lebih dari 180 hari</button>
                </div>
            </div>
        `;
        document.querySelectorAll("[data-hari]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
                const hari = btn.getAttribute("data-hari");
                const m = await modal({
                    judul: "Hapus Log " + hari + " Hari",
                    isiHtml: "Semua riwayat aktivitas yang lebih lama dari <strong>" + hari + " hari</strong> akan dihapus permanen. Ketik <strong>HAPUS</strong> untuk melanjutkan.",
                    input: "teks", placeholder: "Ketik HAPUS", wajibKata: "HAPUS", tombolOk: "Hapus Log",
                });
                if (!m.ok) return;
                const teksAsal = btn.textContent;
                btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Menghapus…";
                try {
                    const res = await API.adminBersihkanLog(hari, "HAPUS");
                    if (!res.ok) throw new Error(res.pesan);
                    UI.toast(res.pesan);
                } catch (err) { UI.toast(err.message || "Gagal menghapus log.", "error"); }
                btn.disabled = false; btn.textContent = teksAsal;
            });
        });
        const selKey = document.getElementById("fPilihKey");
        function isiNilaiSekarang() {
            document.getElementById("fNilaiSekarang").value = cfgPublik[selKey.value] || "(kosong)";
            document.getElementById("keteranganKey").textContent = keteranganKey[selKey.value] || "";
        }
        selKey.addEventListener("change", isiNilaiSekarang);
        isiNilaiSekarang();

        document.getElementById("btnSimpanConfig").addEventListener("click", async function () {
            const key = selKey.value;
            const value = document.getElementById("fNilaiBaru").value;
            const errorBox = document.getElementById("errorConfig");
            errorBox.classList.remove("tampil");
            if (!value) { errorBox.textContent = "Nilai baru wajib diisi."; errorBox.classList.add("tampil"); return; }
            const btn = document.getElementById("btnSimpanConfig");
            btn.disabled = true; btn.innerHTML = UI.ikon("spinner") + " Menyimpan…";
            try {
                const res = await API.adminUpdateConfig(key, value);
                if (!res.ok) throw new Error(res.pesan);
                cfgPublik[key] = value;
                UI.toast("CONFIG." + key + " berhasil diperbarui.");
                document.getElementById("fNilaiBaru").value = "";
                isiNilaiSekarang();
                btn.disabled = false; btn.textContent = "Simpan Perubahan";
            } catch (err) {
                errorBox.textContent = err.message || "Gagal menyimpan.";
                errorBox.classList.add("tampil");
                btn.disabled = false; btn.textContent = "Simpan Perubahan";
            }
        });
    }

    mulai();
</script>
</body>
</html>
